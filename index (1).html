<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#0f766e">
<title>Finanzas</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mu:#6b7280;--ln:#e5e7eb;--pr:#0f766e;--prl:#ccfbf1;--rd:#dc2626;--am:#d97706;--gr:#16a34a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
  #app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 90px)}
  h1{font-size:24px;margin:6px 0 14px}
  h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row+.row{margin-top:10px}
  .mu{color:var(--mu);font-size:13px}
  .b{font-weight:700}
  .big{font-size:26px;font-weight:800}
  .pos{color:var(--gr)}.neg{color:var(--rd)}.warn{color:var(--am)}
  .bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--pr);border-radius:9px}
  .bar.full>i{background:var(--gr)} .bar.over>i{background:var(--am)}
  .goal{padding:10px 0;border-top:1px solid var(--ln)} .goal:first-of-type{border-top:0;padding-top:0}
  input,select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:11px;background:#fff;color:var(--tx)}
  label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
  button{font:inherit;border:0;border-radius:11px;padding:11px 14px;background:var(--pr);color:#fff;font-weight:600;cursor:pointer}
  button.sec{background:var(--prl);color:var(--pr)}
  button.gh{background:transparent;color:var(--pr);padding:8px}
  button.dg{background:#fee2e2;color:var(--rd)}
  button.sm{padding:8px 11px;font-size:14px}
  button:disabled{opacity:.4}
  .full{width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qrow{display:grid;grid-template-columns:1fr 104px 92px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--ln)}
  .qrow:first-child{border-top:0}
  .qrow input{padding:8px 9px;text-align:right}
  .done{background:var(--gr)!important;color:#fff!important}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--ln);color:var(--mu);margin-left:4px;vertical-align:middle}
  .tag.mp{background:#dbeafe;color:#1d4ed8}.tag.bn{background:#fee2e2;color:#b91c1c}.tag.pg{background:#f3e8ff;color:#7e22ce}
  .sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 74px);z-index:2}
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
  nav button{background:none;color:var(--mu);font-size:11px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500;flex:1}
  nav button span{font-size:20px}
  nav button.on{color:var(--pr);font-weight:700}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 86px);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:10;max-width:90%}
  #toast.show{opacity:1}
  .center{text-align:center}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.2em;font-weight:800}
</style>
</head>
<body>
<div id="app"><p class="mu center">Cargando…</p></div>
<nav id="nav" hidden>
  <button data-t="resumen" onclick="go('resumen')"><span>🏠</span>Resumen</button>
  <button data-t="quincena" onclick="go('quincena')"><span>📅</span>Quincena</button>
  <button data-t="metas" onclick="go('metas')"><span>🎯</span>Metas</button>
  <button data-t="ingresos" onclick="go('ingresos')"><span>💵</span>Ingresos</button>
  <button data-t="movs" onclick="go('movs')"><span>🧾</span>Movimientos</button>
</nav>
<div id="toast"></div>

<script>
// ============ CONFIGURACIÓN: pega aquí tus datos de Supabase ============
const SUPABASE_URL = 'https://savkihtjsvzmahcgvygr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_u9vum-h6roZid1UFmpW7Yw_EbZ-srT9';
// =======================================================================

const sb = (SUPABASE_URL.startsWith('http')) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const S = {user:null, hh:null, me:'', members:[], who:'Todos', incomes:[], goals:[], plan:[], movs:[], tab:'resumen', q:null, edit:null, editInc:null, move:null};
const ACCOUNTS = ['Banorte','Mercado Pago','Afore','Efectivo','Pago'];
const KINDS = {fijo:'Gasto fijo', meta:'Meta de ahorro', pago:'Pago / deuda'};

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const sum = a => a.reduce((x,y)=>x+(+y||0),0);
const money = n => (n<0?'-':'')+'$'+Math.abs(Math.round(+n||0)).toLocaleString('es-MX');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const iso = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const qEnd = (y,m) => Math.min(30, new Date(y,m,0).getDate());   // día 30 (o 28/29 en febrero)
function todayISO(){ const t=new Date(); return iso(t.getFullYear(),t.getMonth()+1,t.getDate()); }
function fmtD(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+dd} ${MES[m-1]}${+y!==new Date().getFullYear()?' '+y.slice(2):''}`; }
function currentQ(){ const t=new Date(), y=t.getFullYear(), m=t.getMonth()+1, d=t.getDate();
  if(d>=qEnd(y,m)) return iso(y,m,qEnd(y,m)); if(d>=15) return iso(y,m,15);
  const pm=m===1?12:m-1, py=m===1?y-1:y; return iso(py,pm,qEnd(py,pm)); }
function shiftQ(q,dir){ let [y,m,d]=q.split('-').map(Number);
  if(dir>0){ if(d===15) return iso(y,m,qEnd(y,m)); m++; if(m>12){m=1;y++;} return iso(y,m,15); }
  if(d!==15) return iso(y,m,15); m--; if(m<1){m=12;y--;} return iso(y,m,qEnd(y,m)); }
function qList(from,to){ const out=[]; let q=from; while(q<=to){ out.push(q); q=shiftQ(q,1);} return out; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function fail(e){ console.error(e); toast(e?.message||String(e)); }
const tagFor = a => `<span class="tag ${a==='Mercado Pago'?'mp':a==='Banorte'?'bn':a==='Pago'?'pg':''}">${esc(a)}</span>`;

// ---------- personas ----------
const people = () => [...S.members.map(m=>(m.display_name||'').split(' ')[0]).filter(Boolean), 'Compartido'];
const mine = o => S.who==='Todos' || (o.owner||'Compartido')===S.who;
function whoBar(){
  return `<div style="display:flex;gap:6px;overflow-x:auto;margin:0 0 12px">${['Todos',...people()].map(p=>
    `<button class="sm ${S.who===p?'':'sec'}" style="flex:none" onclick="S.who='${esc(p)}';render()">${esc(p)}</button>`).join('')}</div>`;
}
const ownerSel = (id,val) => `<select id="${id}">${people().map(p=>`<option ${val===p?'selected':''}>${esc(p)}</option>`).join('')}</select>`;
const defOwner = () => S.who!=='Todos' ? S.who : ((S.me||'').split(' ')[0] || 'Compartido');

// ---------- cálculos ----------
const goalById = id => S.goals.find(g=>g.id===id);
const goalBal = id => sum(S.movs.filter(m=>m.goal_id===id).map(m=>m.amount));
const movMine = m => { if(S.who==='Todos') return true; const g=goalById(m.goal_id); return g ? mine(g) : false; };
const accBal = a => sum(S.movs.filter(m=>m.account===a && movMine(m)).map(m=>m.amount));
const accBalAll = a => sum(S.movs.filter(m=>m.account===a).map(m=>m.amount));
const activeGoals = () => S.goals.filter(g=>!g.archived && mine(g));
const incomeFor = q => S.incomes.filter(i=>mine(i)&&(!i.start_date||i.start_date<=q)&&(!i.end_date||i.end_date>=q));
const planFor = q => S.plan.filter(p=>{ const g=goalById(p.goal_id); return p.quincena===q && g && !g.archived && mine(g); });
const planOf = (gid,q) => S.plan.find(p=>p.goal_id===gid&&p.quincena===q);
function projection(g){ // ¿en qué quincena llegas a la meta siguiendo el plan?
  if(!g.target) return null; let acc=goalBal(g.id); if(acc>=g.target-0.5) return 'ok';
  const rows=S.plan.filter(p=>p.goal_id===g.id&&!p.done).sort((a,b)=>a.quincena<b.quincena?-1:1);
  for(const p of rows){ acc+=+p.amount; if(acc>=g.target-0.5) return p.quincena; } return 'no'; }

// ---------- arranque ----------
async function boot(){
  if(!sb) return vConfig();
  const {data:{session}} = await sb.auth.getSession();
  S.user = session?.user||null;
  if(!S.user) return vLogin();
  const {data:mem,error} = await sb.from('members').select('household_id,display_name').eq('user_id',S.user.id).limit(1);
  if(error) return fail(error);
  if(!mem.length) return vHousehold();
  S.hh={id:mem[0].household_id}; S.me=mem[0].display_name||'';
  try{ await loadAll(); }catch(e){ return fail(e); }
  S.q = S.q||currentQ(); render();
}
async function loadAll(){
  const h=S.hh.id;
  const r = await Promise.all([
    sb.from('households').select('*').eq('id',h).single(),
    sb.from('incomes').select('*').eq('household_id',h).order('created_at'),
    sb.from('goals').select('*').eq('household_id',h).order('sort').order('created_at'),
    sb.from('plan').select('*').eq('household_id',h),
    sb.from('movements').select('*').eq('household_id',h).order('date',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('members').select('user_id,display_name').eq('household_id',h)
  ]);
  for(const x of r) if(x.error) throw x.error;
  [S.hh,S.incomes,S.goals,S.plan,S.movs,S.members] = r.map(x=>x.data);
}
async function refresh(){ try{ await loadAll(); render(); }catch(e){ fail(e); } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.hh) refresh(); });

function render(){
  $('#nav').hidden=false;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  $('#app').innerHTML = ({resumen:vResumen,quincena:vQuincena,metas:vMetas,ingresos:vIngresos,movs:vMovs,hogar:vHogar}[S.tab])();
}
function go(t){ S.tab=t; S.edit=S.editInc=S.move=null; render(); scrollTo(0,0); }

// ---------- pantallas sin sesión ----------
function vConfig(){ $('#app').innerHTML=`<h1>Falta configurar</h1><div class="card">Abre <b>index.html</b> y pega tu <b>Project URL</b> y tu <b>anon key</b> de Supabase en las líneas de CONFIGURACIÓN.</div>`; }
function vLogin(){
  $('#nav').hidden=true;
  $('#app').innerHTML=`<h1>💰 Finanzas</h1><div class="card">
    <label>Correo</label><input id="em" type="email" autocomplete="email">
    <label>Contraseña</label><input id="pw" type="password" autocomplete="current-password">
    <div class="grid2" style="margin-top:14px"><button onclick="doLogin(false)">Entrar</button><button class="sec" onclick="doLogin(true)">Crear cuenta</button></div></div>`;
}
async function doLogin(signup){
  const email=$('#em').value.trim(), password=$('#pw').value;
  if(!email||password.length<6) return toast('Correo y contraseña (mín. 6)');
  const r = signup ? await sb.auth.signUp({email,password}) : await sb.auth.signInWithPassword({email,password});
  if(r.error) return fail(r.error);
  if(signup&&!r.data.session) return toast('Revisa tu correo para confirmar y luego entra');
  boot();
}
function vHousehold(){
  $('#nav').hidden=true;
  $('#app').innerHTML=`<h1>Tu hogar</h1>
  <div class="card"><h2>Tu nombre</h2><input id="dn" placeholder="Ej. Edgar"></div>
  <div class="card"><h2>Crear hogar nuevo</h2><input id="hn" placeholder="Ej. Edgar y …">
    <button class="full" style="margin-top:10px" onclick="createHH()">Crear</button></div>
  <div class="card"><h2>Unirme con código</h2><input id="cd" placeholder="Código de 6 letras" style="text-transform:uppercase">
    <button class="full sec" style="margin-top:10px" onclick="joinHH()">Unirme</button></div>
  <button class="gh full" onclick="logout()">Salir</button>`;
}
async function createHH(){ const {error}=await sb.rpc('create_household',{p_name:$('#hn').value.trim(),p_display:$('#dn').value.trim()}); if(error) return fail(error); boot(); }
async function joinHH(){ const {error}=await sb.rpc('join_household',{p_code:$('#cd').value,p_display:$('#dn').value.trim()}); if(error) return fail(error); boot(); }
async function logout(){ await sb.auth.signOut(); Object.assign(S,{user:null,hh:null,q:null}); boot(); }

// ---------- RESUMEN ----------
function vResumen(){
  const q=currentQ(), inc=sum(incomeFor(q).map(i=>i.amount)), pq=planFor(q);
  const asg=sum(pq.map(p=>p.amount)), hecho=sum(pq.filter(p=>p.done).map(p=>p.amount));
  const tope=+S.hh.mp_tope, mp=accBalAll('Mercado Pago');
  const accs=['Banorte','Mercado Pago','Afore','Efectivo'].filter(a=>a==='Mercado Pago'||a==='Banorte'||Math.abs(accBal(a))>0.5);
  const guardado=sum(accs.map(accBal));
  const metas=activeGoals().filter(g=>g.kind!=='fijo');
  const fijos=activeGoals().filter(g=>g.kind==='fijo');
  return `<div class="row"><h1>Hola${S.me?', '+esc(S.me.split(' ')[0]):''} 👋</h1><button class="sec sm" onclick="go('hogar')">⚙️ Hogar</button></div>
  ${whoBar()}
  <div class="card"><h2>Quincena ${fmtD(q)}${S.who!=='Todos'?' · '+esc(S.who):''}</h2>
    <div class="row"><span>Entra</span><b>${money(inc)}</b></div>
    <div class="row"><span>Repartido en el plan</span><b>${money(asg)}</b></div>
    <div class="row"><span>Ya apartado de verdad</span><b class="pos">${money(hecho)}</b></div>
    <div class="row"><span>Falta repartir</span><b class="${inc-asg<0?'neg':''}">${money(inc-asg)}</b></div>
    <button class="sec full" style="margin-top:12px" onclick="S.q=currentQ();go('quincena')">Ir a la quincena</button></div>
  <div class="card"><h2>Dónde está el dinero</h2>
    <div class="big">${money(guardado)}</div><div class="mu">guardado en total</div>
    ${accs.map(a=>{ const v=accBal(a); return `<div class="row"><span>${tagFor(a)}</span><b>${money(v)}</b></div>`+
      (a==='Mercado Pago'?`<div class="bar ${mp>tope?'over':mp>=tope-0.5?'full':''}"><i style="width:${Math.min(100,mp/tope*100)}%"></i></div><div class="mu">${mp>tope?'⚠️ Pasaste el tope de ':'Tope '}${money(tope)} · lleva ${money(mp)} entre los dos · libre ${money(Math.max(0,tope-mp))}</div>`:''); }).join('')}
  </div>
  <div class="card"><h2>Metas</h2>${metas.length?metas.map(gGoal).join(''):'<p class="mu">Aún no hay metas.</p>'}</div>
  ${fijos.length?`<div class="card"><h2>Gastos fijos (saldo)</h2>${fijos.map(g=>`<div class="row"><span>${esc(g.name)} ${tagFor(g.account)}</span><b>${money(goalBal(g.id))}</b></div>`).join('')}</div>`:''}`;
}
function vHogar(){
  const tope=+S.hh.mp_tope;
  return `<div class="row"><h1>⚙️ Hogar</h1><button class="sec sm" onclick="go('resumen')">‹ Volver</button></div>
  <div class="card"><h2>${esc(S.hh.name)}</h2>
    ${S.members.map(m=>`<div class="row"><span>👤 ${esc(m.display_name||'Sin nombre')}</span>${m.user_id===S.user.id?'<span class="tag">tú</span>':''}</div>`).join('')}
    <div class="row" style="margin-top:14px"><span>Código para invitar</span><span class="code">${esc(S.hh.invite_code)}</span></div></div>
  <div class="card"><h2>Mercado Pago</h2>
    <label>Tope que deja apartar con rendimiento</label>
    <div class="row"><input id="tope" type="number" inputmode="decimal" value="${tope}"><button class="sm" onclick="saveTope()">Guardar</button></div>
    <div class="mu" style="margin-top:6px">Hoy hay ${money(accBalAll('Mercado Pago'))} entre los dos.</div></div>
  ${!S.goals.length?`<div class="card"><button class="full" onclick="seed()">⚡ Cargar plan de Edgar (oct 26 – jul 27)</button></div>`:''}
  <button class="dg full" onclick="logout()">Cerrar sesión</button>`;
}
function gGoal(g){
  const bal=goalBal(g.id), t=+g.target||0, pct=t?Math.min(100,bal/t*100):0, pr=projection(g);
  const prTxt = !t?'' : pr==='ok'?'<span class="pos">✅ Cumplida</span>' : pr==='no'?'<span class="neg">El plan no alcanza</span>' : `Con el plan: <b>${fmtD(pr)}</b>${g.due_date&&pr>g.due_date?' <span class="warn">(tarde)</span>':''}`;
  return `<div class="goal"><div class="row"><span class="b">${esc(g.name)} ${tagFor(g.account)}</span><span><b>${money(bal)}</b>${t?` <span class="mu">/ ${money(t)}</span>`:''}</span></div>
    ${t?`<div class="bar ${pct>=100?'full':''}"><i style="width:${pct}%"></i></div>`:''}
    <div class="row mu" style="margin-top:4px"><span>${prTxt}</span><span>${g.due_date?'Meta: '+fmtD(g.due_date):''}</span></div></div>`;
}
async function saveTope(){ const v=parseFloat($('#tope').value)||0; const {error}=await sb.from('households').update({mp_tope:v}).eq('id',S.hh.id); if(error) return fail(error); toast('Tope guardado'); refresh(); }

// ---------- QUINCENA ----------
function vQuincena(){
  const q=S.q, incs=incomeFor(q), inc=sum(incs.map(i=>i.amount));
  const gs=activeGoals(), asg=sum(planFor(q).map(p=>p.amount));
  const ord={fijo:0,pago:1,meta:2};
  return `<div class="row" style="margin:6px 0 12px"><button class="sec sm" onclick="S.q=shiftQ(S.q,-1);render()">‹</button>
      <h1 style="margin:0">${fmtD(q)}${q===currentQ()?' <span class="tag">actual</span>':''}</h1>
      <button class="sec sm" onclick="S.q=shiftQ(S.q,1);render()">›</button></div>
  ${whoBar()}
  <div class="card"><h2>Ingresos</h2>${incs.length?incs.map(i=>`<div class="row"><span>${esc(i.name)}${i.end_date?` <span class="mu">hasta ${fmtD(i.end_date)}</span>`:''}</span><b>${money(i.amount)}</b></div>`).join(''):'<p class="mu">Sin ingresos en esta quincena</p>'}</div>
  <div class="card"><h2>Reparto</h2>
    ${gs.length?[...gs].sort((a,b)=>ord[a.kind]-ord[b.kind]).map(g=>{ const p=planOf(g.id,q), amt=p?+p.amount:0;
      return `<div class="qrow"><div><div class="b">${esc(g.name)}</div><div>${tagFor(g.account)}</div></div>
        <input type="number" inputmode="decimal" value="${amt||''}" placeholder="0" ${p&&p.done?'disabled':''} onchange="setPlan('${g.id}',this.value)">
        ${p&&p.done?`<button class="sm done" onclick="undoDone('${p.id}')">✓ Hecho</button>`:`<button class="sm sec" ${!amt?'disabled':''} onclick="markDone('${p?p.id:''}')">Apartar</button>`}</div>`; }).join(''):'<p class="mu">Crea metas en la pestaña 🎯</p>'}
    <button class="gh full" style="margin-top:8px" onclick="copyPrev()">Copiar montos de la quincena anterior</button></div>
  <div class="card sticky"><div class="grid2"><div><div class="mu">Entra</div><b>${money(inc)}</b></div><div><div class="mu">Ya repartido</div><b>${money(asg)}</b></div></div>
    <div class="row" style="margin-top:8px"><span>${inc-asg<0?'Te pasaste por':'Falta repartir'}</span><b class="${inc-asg<0?'neg':inc-asg>0?'warn':'pos'}">${money(Math.abs(inc-asg))}${inc-asg===0?' ✓':''}</b></div></div>`;
}
async function setPlan(gid,val){
  const amount=parseFloat(val)||0;
  const {error}=await sb.from('plan').upsert({household_id:S.hh.id,goal_id:gid,quincena:S.q,amount},{onConflict:'goal_id,quincena'});
  if(error) return fail(error); refresh();
}
async function markDone(pid){
  const p=S.plan.find(x=>x.id===pid); if(!p) return; const g=goalById(p.goal_id), amt=+p.amount; if(!g||!amt) return;
  let rows=[];
  const base={household_id:S.hh.id,goal_id:g.id,plan_id:p.id,date:todayISO(),note:'Quincena '+fmtD(p.quincena)};
  if(g.account==='Mercado Pago'){ // llena Mercado Pago hasta el tope; lo que sobra va a Banorte
    const room=Math.max(0,+S.hh.mp_tope-accBalAll('Mercado Pago')), inMP=Math.min(room,amt), rest=amt-inMP;
    if(inMP>0) rows.push({...base,account:'Mercado Pago',amount:inMP});
    if(rest>0) rows.push({...base,account:'Banorte',amount:rest,note:base.note+' (excedente del tope MP)'});
    if(rest>0) toast(`Mercado Pago lleno: ${money(rest)} van a Banorte`);
  } else rows.push({...base,account:g.account,amount:amt});
  const a=await sb.from('movements').insert(rows); if(a.error) return fail(a.error);
  const b=await sb.from('plan').update({done:true}).eq('id',p.id); if(b.error) return fail(b.error);
  refresh();
}
async function undoDone(pid){
  if(!confirm('¿Deshacer este apartado? Se borran sus movimientos.')) return;
  const a=await sb.from('movements').delete().eq('plan_id',pid); if(a.error) return fail(a.error);
  const b=await sb.from('plan').update({done:false}).eq('id',pid); if(b.error) return fail(b.error);
  refresh();
}
async function copyPrev(){
  const prev=shiftQ(S.q,-1), rows=planFor(prev).filter(p=>!planOf(p.goal_id,S.q))
    .map(p=>({household_id:S.hh.id,goal_id:p.goal_id,quincena:S.q,amount:p.amount}));
  if(!rows.length) return toast('Nada que copiar');
  const {error}=await sb.from('plan').insert(rows); if(error) return fail(error); toast('Copiado'); refresh();
}

// ---------- METAS ----------
function vMetas(){
  const e=S.edit==='new'?{kind:'meta',account:'Banorte',owner:defOwner()}:S.edit?goalById(S.edit):null;
  const list=activeGoals();
  return `<div class="row"><h1>Metas y apartados</h1><button class="sm" onclick="S.edit='new';S.move=null;render()">+ Nueva</button></div>
  ${whoBar()}
  ${e?`<div class="card"><h2>${S.edit==='new'?'Nueva':'Editar'}</h2>
    <div class="grid2"><div><label>Nombre</label><input id="g_name" value="${esc(e.name)}"></div>
    <div><label>De quién</label>${ownerSel('g_owner',e.owner||'Compartido')}</div></div>
    <div class="grid2"><div><label>Tipo</label><select id="g_kind">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${e.kind===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div><label>Dónde se guarda</label><select id="g_acc">${ACCOUNTS.map(a=>`<option ${e.account===a?'selected':''}>${a}</option>`).join('')}</select></div></div>
    <div class="grid2"><div><label>Meta $ (opcional)</label><input id="g_target" type="number" inputmode="decimal" value="${e.target??''}"></div>
    <div><label>Fecha meta</label><input id="g_due" type="date" value="${e.due_date??''}"></div></div>
    <label>Orden</label><input id="g_sort" type="number" value="${e.sort??0}">
    <div class="grid2" style="margin-top:12px"><button onclick="saveGoal()">Guardar</button><button class="sec" onclick="S.edit=null;render()">Cancelar</button></div>
    ${S.edit!=='new'?`<div class="grid2" style="margin-top:10px"><button class="sec" onclick="archiveGoal('${e.id}')">Archivar</button><button class="dg" onclick="delGoal('${e.id}')">🗑 Borrar</button></div>
    <div class="mu" style="margin-top:6px">Archivar: la quita del reparto pero guarda su historial. Borrar: la elimina con su plan.</div>`:''}</div>`:''}
  <div class="card">${list.length?list.map(g=>{ const bal=goalBal(g.id);
    return `<div class="goal"><div class="row"><span class="b">${esc(g.name)} ${tagFor(g.account)}</span><b>${money(bal)}</b></div>
      <div class="row mu" style="margin-top:2px"><span>${S.who==='Todos'?esc(g.owner||'Compartido')+' · ':''}${KINDS[g.kind]}${g.target?' · meta '+money(g.target):''}${g.due_date?' · '+fmtD(g.due_date):''}</span>
      <span><button class="gh sm" onclick="S.move='${g.id}';S.edit=null;render()">Mover $</button><button class="gh sm" onclick="S.edit='${g.id}';S.move=null;render()">Editar</button></span></div>
      ${S.move===g.id?vMove(g):''}</div>`; }).join(''):'<p class="mu">Sin metas. En Resumen puedes cargar tu plan.</p>'}</div>`;
}
function vMove(g){
  return `<div style="background:var(--bg);padding:10px;border-radius:12px;margin-top:8px">
    <div class="grid2"><div><label>Tipo</label><select id="m_dir"><option value="1">Depositar</option><option value="-1">Retirar / pagar</option></select></div>
    <div><label>Monto</label><input id="m_amt" type="number" inputmode="decimal"></div></div>
    <div class="grid2"><div><label>Cuenta</label><select id="m_acc">${ACCOUNTS.map(a=>`<option ${g.account===a?'selected':''}>${a}</option>`).join('')}</select></div>
    <div><label>Fecha</label><input id="m_date" type="date" value="${todayISO()}"></div></div>
    <label>Nota</label><input id="m_note" placeholder="Opcional">
    <div class="grid2" style="margin-top:10px"><button onclick="saveMove('${g.id}')">Guardar</button><button class="sec" onclick="S.move=null;render()">Cancelar</button></div></div>`;
}
async function saveGoal(){
  const row={household_id:S.hh.id,name:$('#g_name').value.trim(),owner:$('#g_owner').value,kind:$('#g_kind').value,account:$('#g_acc').value,
    target:parseFloat($('#g_target').value)||null,due_date:$('#g_due').value||null,sort:parseInt($('#g_sort').value)||0};
  if(!row.name) return toast('Ponle nombre');
  const r = S.edit==='new' ? await sb.from('goals').insert(row) : await sb.from('goals').update(row).eq('id',S.edit);
  if(r.error) return fail(r.error); S.edit=null; refresh();
}
async function archiveGoal(id){ if(!confirm('¿Archivar? Deja de aparecer en el reparto.')) return;
  const {error}=await sb.from('goals').update({archived:true}).eq('id',id); if(error) return fail(error); S.edit=null; refresh(); }
async function delGoal(id){
  const g=goalById(id); if(!confirm(`¿Borrar "${g?g.name:''}"? Se borra su plan; sus movimientos quedan en el historial sin meta.`)) return;
  const {error}=await sb.from('goals').delete().eq('id',id); if(error) return fail(error); S.edit=null; toast('Borrada'); refresh(); }
async function saveMove(gid){
  const amt=(parseFloat($('#m_amt').value)||0)*(+$('#m_dir').value); if(!amt) return toast('Pon un monto');
  const {error}=await sb.from('movements').insert({household_id:S.hh.id,goal_id:gid,account:$('#m_acc').value,amount:amt,date:$('#m_date').value||todayISO(),note:$('#m_note').value.trim()||null});
  if(error) return fail(error); S.move=null; toast('Guardado'); refresh();
}

// ---------- INGRESOS ----------
function vIngresos(){
  const e=S.editInc==='new'?{owner:defOwner()}:S.editInc?S.incomes.find(i=>i.id===S.editInc):null;
  const incs=S.incomes.filter(mine);
  return `<div class="row"><h1>Ingresos</h1><button class="sm" onclick="S.editInc='new';render()">+ Nuevo</button></div>
  ${whoBar()}
  ${e?`<div class="card"><div class="grid2"><div><label>Concepto</label><input id="i_name" value="${esc(e.name)}"></div>
    <div><label>De quién</label>${ownerSel('i_owner',e.owner||'Compartido')}</div></div>
    <label>Monto por quincena</label><input id="i_amt" type="number" inputmode="decimal" value="${e.amount??''}">
    <div class="grid2"><div><label>Desde (opcional)</label><input id="i_start" type="date" value="${e.start_date??''}"></div>
    <div><label>Hasta (opcional)</label><input id="i_end" type="date" value="${e.end_date??''}"></div></div>
    <div class="grid2" style="margin-top:12px"><button onclick="saveInc()">Guardar</button><button class="sec" onclick="S.editInc=null;render()">Cancelar</button></div>
    ${S.editInc!=='new'?`<button class="dg full" style="margin-top:10px" onclick="delInc('${e.id}')">Eliminar</button>`:''}</div>`:''}
  <div class="card">${incs.length?incs.map(i=>`<div class="row"><span><b>${esc(i.name)}</b><br><span class="mu">${S.who==='Todos'?esc(i.owner||'Compartido')+' · ':''}${i.start_date?'desde '+fmtD(i.start_date)+' ':''}${i.end_date?'hasta '+fmtD(i.end_date):'sin fecha de fin'}</span></span>
    <span><b>${money(i.amount)}</b> <button class="gh sm" onclick="S.editInc='${i.id}';render()">Editar</button></span></div>`).join(''):'<p class="mu">Sin ingresos</p>'}
    <div class="row" style="border-top:1px solid var(--ln);padding-top:10px;margin-top:10px"><span>Esta quincena</span><b>${money(sum(incomeFor(currentQ()).map(i=>i.amount)))}</b></div></div>`;
}
async function saveInc(){
  const row={household_id:S.hh.id,name:$('#i_name').value.trim(),owner:$('#i_owner').value,amount:parseFloat($('#i_amt').value)||0,start_date:$('#i_start').value||null,end_date:$('#i_end').value||null};
  if(!row.name) return toast('Ponle nombre');
  const r = S.editInc==='new' ? await sb.from('incomes').insert(row) : await sb.from('incomes').update(row).eq('id',S.editInc);
  if(r.error) return fail(r.error); S.editInc=null; refresh();
}
async function delInc(id){ if(!confirm('¿Eliminar ingreso?')) return; const {error}=await sb.from('incomes').delete().eq('id',id); if(error) return fail(error); S.editInc=null; refresh(); }

// ---------- MOVIMIENTOS ----------
function vMovs(){
  const ms=S.movs.filter(movMine);
  return `<h1>Movimientos</h1>${whoBar()}<div class="card">${ms.length?ms.slice(0,200).map(m=>{ const g=goalById(m.goal_id);
    return `<div class="goal"><div class="row"><span><b>${esc(g?g.name:'—')}</b> ${tagFor(m.account)}</span><b class="${m.amount<0?'neg':'pos'}">${money(m.amount)}</b></div>
      <div class="row mu"><span>${fmtD(m.date)}${m.note?' · '+esc(m.note):''}</span><button class="gh sm" onclick="delMov('${m.id}')">Borrar</button></div></div>`; }).join(''):'<p class="mu">Aún no hay movimientos. Se crean al tocar “Apartar” en la quincena.</p>'}</div>`;
}
async function delMov(id){ if(!confirm('¿Borrar movimiento?')) return; const {error}=await sb.from('movements').delete().eq('id',id); if(error) return fail(error); refresh(); }

// ---------- PLAN PRECARGADO ----------
async function seed(){
  if(!confirm('¿Cargar tu plan de oct 2026 a jul 2027?')) return;
  const h=S.hh.id;
  const inc=[{name:'Nómina PYMA',amount:13000},{name:'Cadil',amount:4500,end_date:'2027-01-30'},{name:'Moni',amount:800}];
  const G=[
    ['Renta','fijo','Banorte',null,null],['Servicios','fijo','Banorte',null,null],['Gastos Edgar','fijo','Banorte',null,null],
    ['Mecánico','pago','Pago',4000,'2026-10-30'],['Tarjeta','pago','Pago',2500,'2026-10-30'],
    ['Pintura camioneta','meta','Banorte',14000,'2026-11-30'],['Préstamo mamá Moni','pago','Banorte',20000,'2026-12-30'],
    ['Navidad','meta','Banorte',6000,'2026-12-15'],
    ['Fondo médico','meta','Mercado Pago',60000,'2027-07-15'],['Fondo libre','meta','Mercado Pago',45000,'2027-07-15'],['Retiro','meta','Mercado Pago',null,null]
  ].map(([name,kind,account,target,due_date],i)=>({household_id:h,owner:'Edgar',name,kind,account,target,due_date,sort:i}));
  const a=await sb.from('incomes').insert(inc.map(x=>({household_id:h,owner:'Edgar',...x}))); if(a.error) return fail(a.error);
  const b=await sb.from('goals').insert(G).select(); if(b.error) return fail(b.error);
  const id=Object.fromEntries(b.data.map(g=>[g.name,g.id]));
  const N2=['Fondo médico','Fondo libre'];
  const nov={'Pintura camioneta':4500,'Préstamo mamá Moni':3750,'Navidad':1500,'Fondo médico':750,'Fondo libre':500,'Retiro':500};
  const ene={'Fondo médico':6000,'Fondo libre':5000,'Retiro':500};
  const EXP={
    '2026-10-30':{'Mecánico':4000,'Tarjeta':2500,'Pintura camioneta':5000,'Préstamo mamá Moni':5000,'Navidad':1500,'Fondo médico':664,'Fondo libre':500,'Retiro':500},
    '2026-11-15':nov,'2026-11-30':nov,
    '2026-12-15':{'Préstamo mamá Moni':3750,'Navidad':1500,'Fondo médico':3500,'Fondo libre':2250,'Retiro':500},
    '2026-12-30':{'Préstamo mamá Moni':3750,'Fondo médico':3000,'Fondo libre':4250,'Retiro':500},
    '2027-01-15':ene,'2027-01-30':ene};
  const acc={}, rows=[];
  const put=(q,n,amt)=>{ if(amt>0){ rows.push({household_id:h,goal_id:id[n],quincena:q,amount:amt}); acc[n]=(acc[n]||0)+amt; } };
  for(const q of qList('2026-10-30','2027-07-15')){
    put(q,'Renta',4500); put(q,'Servicios',800); put(q,'Gastos Edgar',1500);
    if(EXP[q]) for(const [n,v] of Object.entries(EXP[q])) put(q,n,v);
    else { // desde feb: 3,500 médico + 3,000 libre; cuando el libre llega a 45k, todo va al médico
      const l=Math.min(3000,45000-(acc['Fondo libre']||0)); const m=Math.min(6500-l,60000-(acc['Fondo médico']||0));
      put(q,'Fondo libre',l); put(q,'Fondo médico',m); put(q,'Retiro',500); }
  }
  const c=await sb.from('plan').insert(rows); if(c.error) return fail(c.error);
  toast('Plan cargado ✅'); refresh();
}

boot();
</script>
