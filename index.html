<style>

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 104px)}

.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--pr);transition:width .4s}

.st{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px}
.st.green{background:var(--okl);color:#047857}.st.yellow{background:var(--wal);color:#92400e}.st.red{background:var(--rdl);color:#b91c1c}.st.done{background:var(--prl);color:var(--pr)}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
input,select,textarea{font:inherit;width:100%;padding:12px 13px;border:1.5px solid var(--ln);border-radius:13px;background:#fff;color:var(--tx);outline:none}

label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px;font-weight:600}
button{font:inherit;border:0;border-radius:13px;padding:12px 15px;background:var(--pr);color:#fff;font-weight:650;cursor:pointer}
button.sec{background:var(--prl);color:var(--pr)}
button.gh{background:transparent;color:var(--pr);padding:8px}
button.dg{background:var(--rdl);color:#b91c1c}
button.ok{background:var(--ok)}
button.mini{padding:7px 11px;font-size:14px;border-radius:11px;white-space:nowrap}
button:disabled{opacity:.4}
.full{width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:47px;text-align:left}

.grid2>*,.grid3>*{min-width:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:20px;background:#fff;color:var(--tx);font-size:14px;font-weight:600;border:1.5px solid var(--ln)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick button{background:#fff;color:var(--tx);border:1.5px solid var(--ln);padding:10px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}

.pick button.on{border-color:var(--pr);background:var(--prl);color:var(--pr)}
.amt{font-size:34px;font-weight:800;text-align:center;border:0;background:var(--prl);color:var(--pr)}

#sheet{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .box{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease}

@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:#111827;color:#fff;padding:11px 17px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
.alert{display:flex;gap:10px;align-items:center;background:var(--rdl);color:#991b1b;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px;font-weight:600}
.alert.y{background:var(--wal);color:#92400e}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.2em;font-weight:800;color:var(--pr)}
.hbar{display:flex;align-items:center;gap:10px;margin-top:10px}

.hbar .tr{flex:1;height:12px;background:var(--ln);border-radius:8px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:8px}

.empty{text-align:center;color:var(--mu);padding:18px 8px}
.empty span{font-size:40px;display:block;margin-bottom:6px}
.sect{font-size:13px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px}

.track{position:relative;margin-top:26px}
.pups{position:absolute;bottom:4px;transform:translateX(-100%);display:flex;gap:0;align-items:flex-end;pointer-events:none}
.pup{width:28px;height:19px}
.pups.run .pup{animation:hop .34s ease-in-out infinite alternate}
.pups.run .pup:nth-child(2){animation-delay:.17s}
.pups.run .pup .lg{transform-box:fill-box;transform-origin:50% 0;animation:leg .34s ease-in-out infinite alternate}
.pups.run .pup .lg.b{animation-direction:alternate-reverse}
.pups.sleep .pup{transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
.pups.sleep .pup:nth-child(2){animation-delay:1.1s}
.pups.sit .pup{transform-origin:50% 100%;animation:breathe .7s ease-in-out infinite}
.pups.sit .tongue{transform-box:fill-box;transform-origin:50% 0;animation:pant .35s ease-in-out infinite alternate}
.zzz{position:absolute;right:-8px;top:-8px;font-size:9px;font-weight:800;color:#94a3b8;line-height:1}
.zzz i{position:absolute;font-style:normal;opacity:0;animation:zz 2.4s linear infinite}
.zzz i:nth-child(2){animation-delay:.8s}.zzz i:nth-child(3){animation-delay:1.6s}
@keyframes hop{to{transform:translateY(-2px)}}
@keyframes leg{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
@keyframes breathe{50%{transform:scaleY(.94)}}
@keyframes pant{to{transform:scaleY(1.6)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(7px,-9px) scale(1.2)}}

.dcol{flex:1;min-width:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;border-radius:6px;height:100%;color:var(--mu)}

.dcol span{position:absolute;bottom:-19px;font-size:10px}
.dcol{position:relative}
.dcol.on i{outline:2px solid var(--pr);outline-offset:1px}
.dcol.on span{color:var(--pr);font-weight:800}
.tri span{font-size:11px}
.tri b.neg{color:var(--rd)}.tri b.pos{color:var(--ok)}.tri b.warn{color:#b45309}
.st.hint{background:#f1f5f9;color:#475569}
.big{display:flex;gap:14px;align-items:center;text-align:left;padding:16px 18px;border-radius:18px;font-size:16px;width:100%}
.big span{font-size:30px}.big small{display:block;font-weight:500;opacity:.85;font-size:13px;margin-top:2px}
.dgb{background:var(--rd)}
.grid3 button small{font-size:12px;font-weight:600}
#net{margin-bottom:12px}
.search{position:relative;margin-bottom:10px}.search input{padding-left:38px}.search span{position:absolute;left:13px;top:12px;font-size:16px;opacity:.6}
.nwbars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px;border-bottom:1px solid var(--ln);padding-bottom:18px;position:relative}
.nwbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.nwbars i{display:block;width:70%;max-width:34px;border-radius:5px 5px 2px 2px}
.nwbars small{font-size:9px;font-weight:700;white-space:nowrap}
.nwbars span{position:absolute;bottom:-17px;font-size:10px;color:var(--mu)}
.today{background:linear-gradient(135deg,#fff7ed,#fef3c7);border:1.5px solid #fde68a}
.today .big2{font-size:28px;font-weight:800;letter-spacing:-.02em;color:#92400e}
/* ---------- laptop / pantalla grande ---------- */
@media (min-width:900px){
  body{font-size:15px}
  #app{max-width:1120px;margin:0 0 0 228px;padding:28px 32px 40px;columns:2;column-gap:20px}
  #app>*{break-inside:avoid}
  #app>h1,#app>.row:not(.sect),#app>.chips,#app>.hero,#app>.alert,#app>#net,#app>.grid3,#app>button.gh,#app>p,#app>.search,#app>.today,#app>img,#app>#mlist{column-span:all}
  #app>.sect{break-after:avoid}
  #app .card,#app .hero{break-inside:avoid;display:block}
  #app>.card{display:inline-block;width:100%}
  nav{top:0;bottom:0;right:auto;width:212px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;padding:28px 14px;border-top:0;border-right:1px solid var(--ln)}
  nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;border-radius:12px;justify-content:flex-start}
  nav button:hover{background:var(--prl)}
  nav button.on{background:var(--prl)}
  nav .fab{order:-1;width:auto;height:auto;border-radius:14px;font-size:16px;margin:0 0 14px;padding:12px 14px}
  nav .fab::after{content:'Nuevo';font-weight:700}
  nav .badge{position:static;margin-left:auto}
  #sheet{align-items:center}
  #sheet .box{border-radius:24px;max-height:86vh;max-width:540px}
  #toast{bottom:28px}
  .item[onclick]:hover,.card[onclick]:hover{filter:brightness(.98)}
}
</style>

  if(dd<15) return iso(y,m,15); if(dd<qEnd(y,m)) return iso(y,m,qEnd(y,m)); return m===12?iso(y+1,1,15):iso(y,m+1,15); }
const perQ = g => freqOf(g)===0 ? (+g.target||0) : (+g.target||0)/(2*freqOf(g));
function addMonths(d,n){ const [y,m,dd]=d.split('-').map(Number); const t=new Date(y,m-1+n,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return iso(t.getFullYear(),t.getMonth()+1,Math.min(dd,last)); }

const TBL = {goals:'goals', movements:'movs', accounts:'accounts', members:'members', pantry:'pantry'};
const matches = (r,m) => Object.entries(m).every(([k,v])=>r[k]===v);
const queue = () => LS.get('fin_queue',[]);
function applyLocal(op){
  if(op.table==='households'){ Object.assign(S.hh,op.row); return; }
  const key=TBL[op.table];
  if(op.action==='insert') for(const r of [].concat(op.row)){ if(!S[key].some(x=>x.id===r.id)) S[key].push({created_at:new Date().toISOString(),created_by:S.user?.id,...r}); }
  else if(op.action==='update') S[key].forEach(r=>{ if(matches(r,op.match)) Object.assign(r,op.row); });
  else if(op.action==='delete') S[key]=S[key].filter(r=>!matches(r,op.match));
  if(key==='movs') S.movs.sort((a,b)=>a.date!==b.date?(a.date<b.date?1:-1):((a.created_at||'')<(b.created_at||'')?1:-1));
}

function db(ops){

  for(const op of ops){
    op._id=uuid();
    if(op.action==='insert') op.row=[].concat(op.row).map(r=>({id:uuid(),household_id:S.hh.id,...r}));

const isNetErr = e => !navigator.onLine || /fetch|network|load failed|timeout/i.test(String(e?.message||e));
let flushing=false;
async function flush(){
  if(flushing||!sb) return; flushing=true; let sent=false;
  try{
    let q;
    while((q=queue()).length){
      const op=q[0]; let r;
      try{ const t=sb.from(op.table);
        r = op.action==='insert' ? await t.insert(op.row) : op.action==='update' ? await t.update(op.row).match(op.match) : await t.delete().match(op.match);
      }catch(e){ break; }
      if(r.error){ if(isNetErr(r.error)) break; if(r.error.code!=='23505') toast('⚠️ No se guardó un cambio: '+r.error.message); }
      LS.set('fin_queue',queue().filter(o=>o._id!==op._id)); sent=true;
    }
  } finally { flushing=false; }
  if(sent && !queue().length){ try{ await loadAll(); render(); }catch(e){} } else renderNet();
}

// ---------- cuentas como app del banco ----------
const ATYPES = {debito:['🏦','Débito / banco'], efectivo:['💵','Efectivo'], vales:['🎟️','Vales'], tdc:['💳','Tarjeta de crédito']};
const atype = a => a ? (a.type||'debito') : 'debito';
const isVales = n => atype(acc(n))==='vales';
const isTdc = n => atype(acc(n))==='tdc';
const accMine = a => S.who==='Todos' || !a.owner || a.owner===S.who;
const liveAccs = () => S.accounts.filter(a=>!a.archived);
const moneyAccs = (vales) => liveAccs().filter(a=>atype(a)!=='tdc'&&(vales||atype(a)!=='vales'));   // donde vive dinero real
const payAccs = () => liveAccs().filter(a=>accMine(a));                                             // con qué pagas
const REAL = new Set(['ingreso','gasto','pago','trans_in','trans_out','mueve','concilia']);           // mueven dinero de verdad
const NOLIB = new Set(['mueve','concilia','carga']);                                                // no tocan el saldo libre
// efecto de un movimiento sobre el dinero libre
const libreFx = m => { if(NOLIB.has(m.kind) || isVales(m.account)) return 0;
  if(!m.goal_id && m.kind!=='aparta' && m.kind!=='retira') return +m.amount;          // ingresos, ajustes, gastos de dinero libre
  if(m.goal_id && (m.kind==='aparta'||m.kind==='retira')) return -m.amount;           // lo que pasa a / regresa de apartados
  return 0; };
const cardGoals = name => S.goals.filter(g=>ex(g).card===name);
// cambios de saldo de una cuenta (para tarjeta: negativo = deuda)
function accFlows(a){
  const out=S.movs.filter(m=>m.account===a.name&&REAL.has(m.kind)).map(m=>({d:m.date,v:+m.amount,k:m.kind}));
  if(atype(a)==='tdc'){ const ids=new Set(cardGoals(a.name).map(g=>g.id));
    for(const m of S.movs) if(m.kind==='pago'&&ids.has(m.goal_id)) out.push({d:m.date,v:-m.amount,k:'abono'}); }
  return out;
}
const accBal = a => sum(accFlows(a).map(f=>f.v));
const accBalAt = (a,t) => accBal(a) - sum(accFlows(a).filter(f=>f.d>t&&f.k!=='concilia').map(f=>f.v));   // hacia atrás desde hoy
const accOk = a => S.movs.some(m=>m.account===a.name&&m.kind==='concilia');                            // ¿ya se cuadró con el banco?
function dayIn(y,m,d){ return iso(y,m,Math.min(d,new Date(y,m,0).getDate())); }
function cardInfo(a){
  const debt=Math.max(0,-accBal(a)), t=todayISO(), [y,m]=t.split('-').map(Number), cd=+a.corte_day, pd=+a.pago_day;
  let corte=null, due=null, stmt=debt, auto=true;
  if(cd){ corte=dayIn(y,m,cd); if(corte>t){ const pm=m===1?12:m-1, py=m===1?y-1:y; corte=dayIn(py,pm,cd); }
    if(a.corte_date&&a.corte_bal!=null&&a.corte_date>=corte){ stmt=+a.corte_bal; auto=false; }
    else stmt=Math.max(0,-accBalAt(a,corte));
    if(pd){ const [cy,cm]=corte.split('-').map(Number); due=pd>cd?dayIn(cy,cm,pd):dayIn(cm===12?cy+1:cy,cm===12?1:cm+1,pd); } }
  const ids=new Set(cardGoals(a.name).map(g=>g.id));
  const paid=corte?-sum(S.movs.filter(x=>x.kind==='pago'&&ids.has(x.goal_id)&&x.date>corte).map(x=>x.amount)):0;
  const sinInt=Math.max(0,Math.min(debt,stmt-paid));
  const lim=+a.limite||0;
  return {debt,corte,due,stmt,auto,paid,sinInt,lim,avail:lim?lim-debt:null,use:lim?debt/lim*100:null};
}
// ---------- cálculos ----------
const inQ = (m,q) => qOf(m.date)===q;
function libre(){ let t=0; for(const m of S.movs) if(movMine(m)) t+=libreFx(m); return t; }
const libreDe = p => { const w=S.who; S.who=p; const l=libre(); S.who=w; return l; };
const daysLeft = () => Math.max(1, daysBetween(todayISO(), shiftQ(currentQ(),1)));
const sumKind = (k,q,f) => sum(S.movs.filter(m=>m.kind===k&&(!q||inQ(m,q))&&movMine(m)&&(!f||f(m))).map(m=>m.amount));
const ingresadoQ = q => sumKind('ingreso',q);
const apartadoQ = q => sumKind('aparta',q);
const gastadoQ = q => -sumKind('gasto',q);

function gst(g, over){
  const o=over||{}, q=currentQ(), today=todayISO();
  const ms=S.movs.filter(m=>m.goal_id===g.id);
  const saldo=sum(ms.map(m=>m.amount))+(o.extra||0);
  const pagado=-sum(ms.filter(m=>m.kind==='pago').map(m=>m.amount));
  const lastPago=ms.filter(m=>m.kind==='pago'&&inQ(m,q)).sort((a,b)=>(a.created_at||'')<(b.created_at||'')?1:-1)[0];
  const aportQ=sum(ms.filter(m=>m.kind==='aparta'&&inQ(m,q)&&(!lastPago||(m.created_at||'')>(lastPago.created_at||''))).map(m=>m.amount))+(o.extra||0);
  const card=ex(g).card&&acc(ex(g).card);
  if(card){ // tarjeta vinculada: la app calcula sola cuánto pagar
    const c=cardInfo(card), porPagar=c.sinInt, falta=Math.max(0,porPagar-saldo), due=c.due, dl=due?daysBetween(today,due):null;
    const n=due?Math.max(1,countQ(q,due)):1, cuota=falta/n, pend=falta>0.5?Math.max(0,cuota-aportQ):0;
    let st,stc='hint';
    if(porPagar<=0.5){st=c.debt>0.5?'Sin pago pendiente ✓':'Sin deuda ✓';stc='done';}
    else if(saldo>=porPagar-0.5){st='Listo para pagar ✓';stc='done';}
    else if(dl!==null&&dl<0){st=`Vencido · faltan ${money(falta)}`;stc='red';}
    else if(dl!==null&&dl<=5){st=`Vence en ${dl} d · faltan ${money(falta)}`;stc='red';}
    else if(pend>0.5){st=`Sugerido ${money(pend)} esta quincena`;}
    else {st='Al corriente';stc='green';}
    return {saldo,pagado,pagCiclo:c.paid,aportQ,avance:saldo,falta,n,cuota,pend,pct:porPagar?Math.min(100,Math.max(0,saldo)/porPagar*100):100,st,stc,due,tgt:porPagar,card:c};
  }
  const target=+g.target||0, due=o.due!==undefined?o.due:g.due_date;
  let avance,falta,n=0,cuota=0,pend=0,pct=0,st='',stc='hint',barc=null,proj=null,need=null,reach=null,cuotaQ=0;
  const cyc=g.cycle_from||g.created_at||'';
  const pagCiclo=-sum(ms.filter(m=>m.kind==='pago'&&(m.created_at||'')>cyc).map(m=>m.amount));
  if(isCyc(g)){
    const porPagar=Math.max(0,target-pagCiclo);
    avance=saldo+pagCiclo; falta=Math.max(0,porPagar-saldo);
    n=due?countQ(q,due):Math.max(1,2*freqOf(g));
    const base=Math.max(0,porPagar-(saldo-aportQ)); cuota=n>0?base/n:base; pend=Math.max(0,Math.min(falta,cuota-aportQ));
    pct=target?Math.min(100,avance/target*100):0;
    const dl=due?daysBetween(today,due):null;
    if(target&&porPagar<=0.5){st='Pagado este periodo ✓';stc='done';}
    else if(target&&saldo>=porPagar-0.5){st=pagCiclo>0.5?`Listo para pagar el resto (${money(porPagar)}) ✓`:'Listo para pagar ✓';stc='done';}
    else if(dl!==null&&dl<0){st=`Vencido · faltan ${money(falta)}`;stc='red';}
    else if(dl!==null&&dl<=5){st=`Vence en ${dl} d · faltan ${money(falta)}`;stc='red';}
    else if(pend>0.5){st=`Sugerido ${money(pend)} esta quincena`;}
    else {st='Al corriente';stc='green';}
  } else {
    avance=g.kind==='pago'?saldo+pagado:saldo; falta=Math.max(0,target-avance);
    cuotaQ=+g.cuota?(g.kind==='meta'&&ex(g).cfreq==='m'?+g.cuota/2:+g.cuota):0;   // metas: cuota por quincena o por mes
    if(target&&due){ n=countQ(q,due); const base=Math.max(0,falta+aportQ); need=n>0?base/n:base; }
    if(cuotaQ){ cuota=cuotaQ; pend=Math.max(0,cuotaQ-aportQ); if(target) pend=Math.min(pend,falta);
      if(g.kind==='meta'&&target){ const restQ=Math.max(0,cuotaQ-aportQ);
        if(due&&n) proj=avance+restQ+cuotaQ*Math.max(0,n-1);
        if(falta>0.5){ const k=Math.ceil(Math.max(0,falta-restQ)/cuotaQ); reach=shiftQ(q,k); } else reach=today;
        if(proj!==null) barc=proj>=target-0.5?'var(--ok)':proj>=target*.85?'var(--wa)':'var(--rd)'; } }
    else if(need!==null){ cuota=need; pend=Math.max(0,need-aportQ); }
    pct=target?Math.min(100,avance/target*100):0;
    if(target&&falta<=0.5){st='Cumplida 🎉';stc='done';barc=null;}
    else if(due&&due<today){st=`Vencida · faltan ${money(falta)}`;stc='red';}
    else if(proj!==null&&proj<target-0.5){st=`Con tu cuota te faltarán ${money(target-proj)}`;stc='yellow';}
    else if(proj!==null&&pend<=0.5){st='Vas a tiempo ✓';stc='green';}
    else if(pend>0.5){st=`Sugerido ${money(pend)} esta quincena`;}
    else if(cuota){st='Al corriente';stc='green';}
    else {st=target?`Faltan ${money(falta)}`:'Sin meta';}
  }
  return {saldo,pagado,pagCiclo,aportQ,avance,falta,n,cuota,pend,pct,st,stc,due,tgt:target,barc,proj,need,reach,cuotaQ};
}

function useCache(c){
  Object.assign(S,{hh:c.hh,me:c.me,members:c.members||[],accounts:c.accounts||[],goals:c.goals||[],movs:c.movs||[],pantry:c.pantry||[]});

async function boot(){
  const cache=LS.get('fin_cache',null);
  if(cache&&!S.hh) useCache(cache);                       // abre al instante con lo guardado
  const slow=setTimeout(()=>{ if(!S.hh) vNoConn('La conexión está lenta o no hay señal.'); },12000);
  if(!sb) sb=await loadSB();
  if(!sb){ clearTimeout(slow); if(!S.hh) vNoConn('No se pudo conectar. La primera vez necesitas señal.'); else renderNet(); return; }
  let session=null, sesOk=true;
  try{ ({data:{session}}=await withTimeout(sb.auth.getSession(),8000)); }catch(e){ sesOk=false; }
  if(!session&&!sesOk){ clearTimeout(slow); if(!S.hh) vNoConn('La conexión está lenta o no hay señal.'); else renderNet(); return; }
  S.user=session?.user||null;
  if(!S.user){ clearTimeout(slow); if(cache&&!navigator.onLine) return useCache(cache); return vLogin(); }
  if(cache&&cache.user===S.user.id&&!S.hh) useCache(cache);
  try{
    const {data:mem,error}=await withTimeout(sb.from('members').select('household_id,display_name').eq('user_id',S.user.id).limit(1),10000);
    if(error) throw error;
    clearTimeout(slow);
    if(!mem.length) return vHousehold();
    S.hh={...(S.hh||{}),id:mem[0].household_id}; S.me=mem[0].display_name||'';
    await withTimeout(loadAll(),15000); render(); flush();
  }catch(e){ clearTimeout(slow); if(!S.hh) vNoConn('No se pudieron traer tus datos. Revisa tu señal.'); else renderNet(); }
}
async function loadAll(){

    sb.from('goals').select('*').eq('household_id',h).order('sort').order('created_at'),
    sb.from('movements').select('*').eq('household_id',h).order('date',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('members').select('user_id,display_name').eq('household_id',h),
    sb.from('accounts').select('*').eq('household_id',h).order('sort').order('created_at'),
    sb.from('pantry').select('*').eq('household_id',h).order('sort').order('created_at')
  ]);
  for(const x of r) if(x.error) throw x.error;
  [S.hh,S.goals,S.movs,S.members,S.accounts,S.pantry]=r.map(x=>x.data);
  for(const op of queue()) applyLocal(op);

function apartarOps(g, amount, kind, note, date){
  const base={goal_id:g.id,kind,date:date||todayISO(),note:note||null,owner:defOwner()};
  const a=acc(g.account);
  if(kind==='aparta' && a && +a.tope){
    const room=Math.max(0,+a.tope-accSaved(a.name,true)), inA=Math.min(room,amount), rest=amount-inA, ov=overflowAcc(), rows=[];
    if(inA>0) rows.push({...base,account:a.name,amount:inA});
    if(rest>0){ rows.push({...base,account:ov,amount:rest,note:`excedente del tope de ${a.name}`}); setTimeout(()=>toast(`${a.name} llegó a su tope: ${money(rest)} van a ${ov}`),1200); }
    return rows;
  }
  return [{...base,account:g.account,amount:kind==='aparta'?amount:-amount}];
}

function saveMov(id){
  const m=S.movs.find(x=>x.id===id); if(!m) return; const v=num($('#em_amt').value); if(v<=0) return toast('Escribe el monto');
  const sign=+m.amount<0?-1:1, date=$('#em_date').value||m.date, note=$('#em_note').value.trim()||null;
  const row={amount:sign*v,date,note};
  if(m.kind==='gasto'){ row.category=EM.cat; row.account=EM.acc; row.owner=EM.owner; if(isVales(EM.acc)) row.goal_id=null; }
  if(m.kind==='ingreso'){ row.category=$('#em_con').value.trim()||null; row.account=EM.acc; row.owner=EM.owner; }
  if(['trans_out','trans_in','mueve'].includes(m.kind)) row.account=EM.acc;
  const ops=[], parts=partnersOf(m);
  if(m.kind==='gasto'){ // la compra con tarjeta se rehace: borra el apartado automático y lo vuelve a crear si sigue siendo con tarjeta
    const link=m.link||uuid(); row.link=link;
    if(m.link) ops.push({table:'movements',action:'delete',match:{link:m.link,kind:'carga'}});
    ops.push({table:'movements',action:'update',row,match:{id}});
    ops.push(...cargaOps({...m,...row}));
  } else {
    ops.push({table:'movements',action:'update',row,match:{id}});
    for(const p of parts) ops.push({table:'movements',action:'update',row:{amount:(+p.amount<0?-1:1)*v,date,note},match:{id:p.id}});
  }
  db(ops); closeSheet(); toast('✅ Movimiento actualizado');
}
function delMov(id){ const m=S.movs.find(x=>x.id===id); if(!m) return; const parts=partnersOf(m);
  if(!confirm(parts.length?'¿Borrar este movimiento? También se borra su otra parte.':'¿Borrar este movimiento?')) return;
  db([{table:'movements',action:'delete',match:{id}},...parts.map(p=>({table:'movements',action:'delete',match:{id:p.id}}))]); closeSheet(); toast('Borrado'); }
function movIcon(m){ const g=goalById(m.goal_id); return m.kind==='trans_out'||m.kind==='trans_in'?'🔁':m.kind==='mueve'?'🔀':m.kind==='concilia'?'⚖️':m.kind==='carga'?'💳':m.kind==='ingreso'?(isVales(m.account)?'🎟️':'💵'):m.kind==='gasto'?catIc(m.category):m.kind==='pago'?'💳':m.kind==='retira'?'↩️':m.kind==='ajuste'?'⚖️':(g?.icon||'🎯'); }
function movLabel(m){ const g=goalById(m.goal_id);
  if(m.kind==='ingreso') return 'Ingreso'+(m.category?' · '+m.category:'');
  if(m.kind==='gasto') return (m.category||'Gasto')+(g?' · de '+g.name:'');
  if(m.kind==='aparta') return 'Apartado a '+(g?.name||'—');
  if(m.kind==='retira') return 'Sacado de '+(g?.name||'—');
  if(m.kind==='pago') return 'Pago de '+(g?.name||'—');
  if(m.kind==='trans_out') return 'Transferencia a '+(m.category||'—')+(g?' · de '+g.name:'');
  if(m.kind==='trans_in') return 'Transferencia de '+(m.category||'—');
  if(m.kind==='mueve') return +m.amount<0?'Movido a '+(m.category||'—'):'Movido de '+(m.category||'—');
  if(m.kind==='concilia') return 'Cuadre con el banco';
  if(m.kind==='carga') return 'Apartado para pagar '+(ex(g||{}).card||g?.name||'tarjeta');

function limitOf(p){ const L=(S.hh.limits||{})[p]; if(!L||!+L.amt) return null;

function saveMove(id,kind){
  const g=goalById(id), v=num($('#mv_amt').value)||(kind==='aparta'?Math.round(gst(g).pend):0); if(v<=0) return toast('Escribe un monto');
  if(kind==='aparta'){ if(!doApartar(g,v)) return; }
  else { const ops=[], sal=Math.max(0,gst(g).saldo), extra=kind==='pago'?v-sal:0;
    if(extra>0.5){ const l=libre(); if(extra>l+0.5&&!confirm(`El apartado tiene ${money(sal)}; faltan ${money(extra)} y tu libre es ${money(l)}. ¿Pagar de todos modos?`)) return;
      ops.push({table:'movements',action:'insert',row:{goal_id:g.id,kind:'aparta',account:g.account,amount:Math.round(extra*100)/100,owner:defOwner(),date:$('#mv_date').value||todayISO(),note:'Para completar el pago'}}); }
    ops.push({table:'movements',action:'insert',row:apartarOps(g,v,kind,$('#mv_note').value.trim(),$('#mv_date').value)});
    const card=!!ex(g).card&&!!acc(ex(g).card);
    if(card){} else if(kind==='pago'&&g.subtype==='tdc'&&+ex(g).total) ops.push({table:'goals',action:'update',row:{extra:{...ex(g),total:Math.max(0,+ex(g).total-v)}},match:{id}});
    if(!card&&kind==='pago'&&isCyc(g)&&($('#mv_done')?.checked || gst(g).pagCiclo+v>=(+g.target||0)-0.5)){
      const row={cycle_from:new Date(Date.now()+120000).toISOString()}; if(g.due_date) row.due_date=addPeriod(g.due_date,freqOf(g));
      ops.push({table:'goals',action:'update',row,match:{id}}); }
    db(ops); }
  closeSheet(); toast(kind==='pago'?`💳 Pago de ${money(v)} registrado${isCyc(g)&&!$('#mv_done')?.checked&&gst(g).falta>0.5?' · pago parcial':''}${g.subtype==='tdc'&&$('#mv_done')?.checked?' · cuando llegue tu nuevo estado de cuenta, actualiza el saldo al corte':''}`:kind==='retira'?`↩ ${money(v)} regresaron a tu saldo libre`:`✅ ${money(v)} a ${g.name}`);
}

function saveGoal(id){
  const kind=$('#e_k').value, sub=kind==='pago'?window._sub:null;
  const row={kind,subtype:sub,icon:window._ic,name:$('#e_name').value.trim(),target:num($('#e_target').value)||null,

  const old=id==='new'?null:goalById(id);
  if(kind==='meta') row.extra={...ex(old||{}),cfreq:$('#e_cf').value};
  if(old&&ex(old).card){ Object.assign(row,{kind:'pago',subtype:'tdc',extra:ex(old),target:null,due_date:null,cuota:null}); }
  else if(sub==='tdc'){

}

const isOut = m => m.kind==='gasto' || m.kind==='trans_out';      // salidas reales
function periodData(R){
  const mine=S.movs.filter(movMine), todos=S.who==='Todos';
  const P=mine.filter(m=>inRange(m,R.a,R.b));
  const start=sum(mine.filter(m=>m.date<R.a).map(libreFx));
  const I=sum(P.filter(m=>m.kind==='ingreso'&&!isVales(m.account)).map(m=>m.amount));
  const TI=todos?0:sum(P.filter(m=>m.kind==='trans_in').map(m=>m.amount));
  const A=sum(P.filter(m=>m.goal_id&&(m.kind==='aparta'||m.kind==='retira')).map(m=>m.amount));
  const G=-sum(P.filter(m=>m.kind==='gasto'&&!m.goal_id&&!isVales(m.account)).map(m=>m.amount));
  const TOm=todos?[]:P.filter(m=>m.kind==='trans_out'&&!m.goal_id);
  const TOby=group(TOm,m=>m.category||'otra persona'), TO=sum(TOby.map(x=>x[1]));
  const AJ=sum(P.filter(m=>!m.goal_id&&(m.kind==='ajuste'||m.kind==='inicial')).map(m=>m.amount));
  const libreTras=start+I+TI-A, end=libreTras-G-TO+AJ;
  const totalDays=daysBetween(R.a,R.end)+1, elapsed=Math.max(1,daysBetween(R.a,R.b)+1);
  const remain=R.live?Math.max(1,daysBetween(todayISO(),R.end)+1):0;
  const spentLibre=G+TO, perDay=spentLibre/elapsed, couldDay=libreTras/totalDays, canDay=R.live?end/remain:null;
  const outs=P.filter(m=>isOut(m)&&originOk(m)&&!(todos&&m.kind==='trans_out'));
  return {P,start,I,TI,A,G,TOby,TO,AJ,libreTras,end,totalDays,elapsed,remain,perDay,couldDay,canDay,outs,todos};
}
function insights(R,D){

    else if(D.perDay>0.5){ const lasts=D.end/D.perDay;
      if(lasts<D.remain-0.5) add(100,'red',`<b>${pre?pre+'a':'A'} este ritmo te quedas sin dinero libre el ${fmtD(addDays(todayISO(),Math.max(0,Math.floor(lasts))))}.</b> Llevas ~${money(D.perDay)} por día; para llegar al ${fmtEnd}: máximo ${money(D.canDay)} por día.`);

  }

  const days=Object.entries(byDay); if(days.length>=3){ const avg=sum(days.map(d=>d[1]))/days.length, top=days.sort((x,y)=>y[1]-x[1])[0];
    if(top[1]>=300&&top[1]>=2.5*avg) add(45,'yellow',`<b>El ${DOW[toDate(top[0]).getDay()]} ${fmtD(top[0])} salieron ${money(top[1])}</b>, ${Math.round(top[1]/avg*10)/10} veces tu promedio.`,`S.openDay=true;S.evo='d';S.evoSel='${top[0]}';render()`); }

function pst(p){ // estado de un producto
  const today=todayISO(), ds=(p.durations||[]).slice(-4);
  const est=ds.length?Math.max(1,Math.round(sum(ds)/ds.length)):Math.max(1,+p.days||30);
  const ends=new Date(toDate(p.last_bought).getTime()+est*dayMs); const endISO=iso(ends.getFullYear(),ends.getMonth()+1,ends.getDate());
  const left=daysBetween(today,endISO), pct=Math.max(0,Math.min(100,left/est*100));
  let c,t;
  if(p.empty){c='red';t='Se acabó · comprar';}
  else if(left<=2){c='red';t=left<0?`Ya debió acabarse (hace ${-left} d)`:left===0?'Se acaba hoy':`Se acaba en ${left} d`;}
  else if(left<=Math.max(4,Math.round(est*.25))){c='yellow';t=`Se acaba en ${left} días`;}
  else {c='green';t=`Le quedan ~${left} días`;}
  return {est,endISO,left,pct:p.empty?0:pct,c,t,learned:ds.length};
}

const lastPrice = p => { const a=p.prices||[]; return a.length?a[a.length-1]:null; };
function priceInfo(p){ // último precio, cambio contra el anterior y costo al mes

  const l=a[a.length-1], prev=a.length>1?a[a.length-2]:null, est=pst(p).est;
  return {p:+l.p, diff:prev?+l.p-+prev.p:null, pct:prev&&+prev.p?(+l.p-+prev.p)/+prev.p*100:null, mes:+l.p/est*30};
}
function pantryBuyDo(id,price){

function pantryOut(id){

function netWorthAt(t){ // patrimonio en una fecha (hacia atrás desde hoy)
  let v=0; for(const a of liveAccs().filter(accMine)) v+=accBalAt(a,t);
  for(const g of S.goals.filter(g=>g.kind==='pago'&&!ex(g).card&&g.subtype!=='tdc'&&mine(g)&&+g.target)){
    if(g.archived) continue; const pag=-sum(S.movs.filter(m=>m.goal_id===g.id&&m.kind==='pago'&&m.date<=t).map(m=>m.amount)); v-=Math.max(0,+g.target-pag); }
  return v;
}
function debtGoals(){ return activeGoals().filter(g=>g.kind==='pago'&&!ex(g).card&&g.subtype!=='tdc'&&+g.target); }

  const accs=liveAccs().filter(accMine), have=accs.filter(a=>atype(a)!=='tdc'), cards=accs.filter(a=>atype(a)==='tdc');

  const tD=sum(dg.map(g=>{ const s=gst(g); return Math.max(0,+g.target-s.pagado); })), net=tH-tC-tD;
  const oldTdc=activeGoals().filter(g=>g.subtype==='tdc'&&!ex(g).card);

  const mx=Math.max(1,...pts.map(p=>Math.abs(p.v)));

  const pend=accs.filter(a=>!accOk(a));

        ${accOk(a)?'':'<span class="st yellow" style="margin-top:5px">Sin cuadrar con el banco</span>'}</div></div>`; }
    return `<div class="item" onclick="sheetAccView('${a.id}')" style="cursor:pointer"><div class="ic" style="background:${a.color}22;color:${a.color}">${ATYPES[ty][0]}</div><div class="grow">
      <div class="row"><span class="nm">${esc(a.name)}</span><b>${money(b)}</b></div>
      <div class="mu sm">${ATYPES[ty][1]}${ap>0.5?` · apartado aquí ${money(ap)}`:''}${+a.rate?` · ${+a.rate}% anual`:''}${a.owner?' · '+esc(a.owner):''}</div>
      ${+a.tope?`<div class="bar"><i style="width:${Math.min(100,ap/a.tope*100)}%;background:${ap>a.tope?'var(--rd)':a.color}"></i></div><div class="mu sm" style="margin-top:3px">Tope de apartados ${money(a.tope)} · ${ap>=a.tope?'lleno':'caben '+money(a.tope-ap)}</div>`:''}

  return `<button class="gh mini" style="padding-left:0" onclick="go('mas')">‹ Más</button><div class="row"><h1>🏦 Cuentas</h1><button class="mini" onclick="sheetAcc('new')">＋ Cuenta</button></div>

    ${pts.length>1?`<div class="nwbars">${pts.map(p=>`<div><small>${money(p.v).replace('$','')}</small><i style="height:${Math.max(3,Math.abs(p.v)/mx*60)}px;background:${p.v<0?'#fca5a5':'rgba(255,255,255,.85)'}"></i><span style="color:rgba(255,255,255,.8)">${p.l}</span></div>`).join('')}</div>`:''}</div>
  ${pend.length?`<div class="alert y">⚖️ <span>${pend.length===1?'1 cuenta':pend.length+' cuentas'} sin cuadrar. Toca cada una y pon el saldo que dice tu banco; desde ahí la app lo lleva sola.</span></div>`:''}

  <div class="sect row"><span>💳 Lo que debes</span><span>${money(tC+tD)}</span></div>
  <div class="card">${cards.map(accRow).join('')}
    ${dg.map(g=>{ const s=gst(g), rest=Math.max(0,+g.target-s.pagado); return `<div class="item" onclick="sheetGoal('${g.id}')" style="cursor:pointer"><div class="ic" style="background:#fff1f2">${esc(g.icon||'🤝')}</div><div class="grow"><div class="row"><span class="nm">${esc(g.name)}</span><b class="neg">${money(rest)}</b></div><div class="mu sm">${g.subtype==='prestamo'?'Crédito':'Deuda'} · pagado ${money(s.pagado)} de ${money(g.target)}${s.saldo>0.5?' · apartado '+money(s.saldo):''}</div></div></div>`; }).join('')}
    ${!cards.length&&!dg.length?'<p class="mu">No debes nada 🎉</p>':''}
    <button class="sec mini" style="margin-top:10px" onclick="sheetAcc('new','tdc')">＋ Tarjeta de crédito</button></div>
  ${S.who==='Todos'&&!pend.filter(a=>atype(a)!=='tdc'&&atype(a)!=='vales').length&&Math.abs(diff)>1?`<div class="card"><h2>🔍 ¿Cuadra todo?</h2>
    <div class="row sm"><span>En tus cuentas (sin vales)</span><b>${money(realAll)}</b></div><div class="row sm"><span>Libre ${money(lib)} + apartados ${money(apart)}</span><b>${money(lib+apart)}</b></div>
    <div class="row" style="margin-top:8px"><span class="b">Diferencia</span><b class="${diff<0?'neg':'pos'}">${money(diff)}</b></div>
    <p class="mu sm">${diff>0?'Tienes más dinero del que la app tiene registrado. Quizá falta registrar un ingreso.':'Tienes menos dinero del que dice la app. Quizá falta registrar un gasto.'}</p>
    <button class="sec mini" onclick="ajusteLibreV(${Math.round(diff*100)/100})">Ajustar mi libre ${money(diff)}</button></div>`:''}
  <p class="mu sm" style="text-align:center">Los vales tienen su propio saldo: no cuentan en tu dinero libre.</p>`;
}
function ajusteLibreV(v){ if(!confirm(`¿Sumar ${money(v)} a tu dinero libre para que cuadre?`)) return;
  db({table:'movements',action:'insert',row:{goal_id:null,kind:'ajuste',account:(moneyAccs()[0]||{}).name||'Efectivo',amount:v,owner:defOwner(),date:todayISO(),note:'Cuadre contra cuentas'}}); toast('✅ Cuadrado'); }
function sheetAccView(id){
  const a=S.accounts.find(x=>x.id===id); if(!a) return; const ty=atype(a), tdc=ty==='tdc', b=accBal(a), c=tdc?cardInfo(a):null;
  const ms=S.movs.filter(m=>m.account===a.name&&REAL.has(m.kind)||tdc&&m.kind==='pago'&&cardGoals(a.name).some(g=>g.id===m.goal_id)).slice(0,25);
  openSheet(`<div style="text-align:center"><div style="font-size:40px">${tdc?'💳':ATYPES[ty][0]}</div><h1 style="margin-bottom:0">${esc(a.name)}</h1>
    <div class="mu">${tdc?'Debes':'Saldo'}</div><div style="font-size:34px;font-weight:800" class="${tdc&&c.debt>0.5?'neg':''}">${money(tdc?c.debt:b)}</div></div>
  ${tdc?`<div class="tri"><span>Límite<b>${c.lim?money(c.lim):'—'}</b></span><span>Disponible<b>${c.lim?money(c.avail):'—'}</b></span><span>Al corte${c.corte?' '+fmtD(c.corte):''}<b>${money(c.stmt)}</b>${c.auto&&c.corte?'calculado':''}</span></div>
    <div class="ins" style="background:var(--prl);color:var(--pr);margin-top:10px">${c.sinInt>0.5?`<b>Paga ${money(c.sinInt)}${c.due?' antes del '+fmtD(c.due):''}</b> para no generar intereses.${c.paid>0.5?` Ya abonaste ${money(c.paid)}.`:''}`:'<b>No tienes pago pendiente</b> de este corte.'}${!a.corte_day?' Pon tus días de corte y pago en Editar.':''}</div>`:''}
  <div class="card" style="background:var(--bg);box-shadow:none;margin-top:10px"><h2 style="margin-bottom:6px">⚖️ Cuadrar con el banco</h2>
    <p class="mu sm" style="margin-top:0">${tdc?'Pon lo que debes hoy según tu app del banco.':'Pon el saldo que dice tu banco hoy.'} La diferencia se registra como cuadre (no cuenta como gasto ni ingreso).</p>
    <div class="row"><input id="cc_v" type="number" inputmode="decimal" placeholder="${Math.round(tdc?c.debt:b)}"><button class="mini" onclick="concilia('${a.id}')">Cuadrar</button></div>
    ${tdc?`<div class="grid2"><div><label>Saldo al corte (estado de cuenta)</label><input id="cc_cb" type="number" inputmode="decimal" value="${a.corte_bal??''}"></div><div><label>Fecha de ese corte</label><input id="cc_cd" type="date" value="${a.corte_date||c.corte||''}"></div></div>
      <button class="sec mini" style="margin-top:8px" onclick="saveCorte('${a.id}')">Guardar estado de cuenta</button>`:''}</div>
  <div class="grid2"><button class="sec" onclick="sheetAcc('${a.id}')">✏️ Editar</button>${tdc?`<button class="ok" onclick="payCard('${a.id}')">💳 Pagar</button>`:`<button class="sec" onclick="sheetMover('${esc(a.name)}')">🔀 Mover</button>`}</div>
  <div class="sect">Movimientos</div>${ms.length?ms.map(movRow).join(''):'<p class="mu">Sin movimientos</p>'}`);
}
function concilia(id){ const a=S.accounts.find(x=>x.id===id), raw=$('#cc_v').value; if(raw==='') return toast('Escribe el saldo');
  const v=num(raw), target=atype(a)==='tdc'?-Math.abs(v):v, d=target-accBal(a);
  if(Math.abs(d)<0.005) return toast('✅ Ya cuadra');
  db({table:'movements',action:'insert',row:{goal_id:null,kind:'concilia',account:a.name,amount:Math.round(d*100)/100,owner:a.owner||defOwner(),date:todayISO(),note:'Cuadre con el banco'}});
  closeSheet(); toast(`⚖️ ${a.name} cuadrada (${d>0?'+':''}${money(d)})`); }
function saveCorte(id){ db({table:'accounts',action:'update',row:{corte_bal:num($('#cc_cb').value)||0,corte_date:$('#cc_cd').value||todayISO()},match:{id}}); closeSheet(); toast('✅ Estado de cuenta guardado'); }
function payCard(id){ const a=S.accounts.find(x=>x.id===id), r=ensureCardGoal(a); if(r.op) db(r.op); const c=cardInfo(a); sheetMove(r.g.id,'pago',Math.round(c.sinInt)||undefined); }
function ensureCardGoal(a){ // cada tarjeta tiene su apartado "pago de tarjeta"
  const g=cardGoals(a.name).find(x=>!x.archived)||cardGoals(a.name)[0]; if(g) return {g};
  const base=moneyAccs().find(x=>!a.owner||!x.owner||x.owner===a.owner)||moneyAccs()[0]||{name:'Banorte'};
  const row={id:uuid(),kind:'pago',subtype:'tdc',name:a.name,icon:'💳',account:base.name,owner:a.owner||defOwner(),extra:{card:a.name},freq_months:1,sort:S.goals.length};
  return {g:row,op:{table:'goals',action:'insert',row}};
}
function sheetAcc(id,preType){
  const a=id==='new'?{color:COLORS[S.accounts.length%COLORS.length],type:preType||'debito',owner:S.who!=='Todos'&&S.who!=='Compartido'?S.who:null}:S.accounts.find(x=>x.id===id);
  window._col=a.color; window._aty=atype(a);
  openSheet(`<h1>${id==='new'?'Nueva cuenta':'Editar cuenta'}</h1>
  <label>Tipo</label><div class="grid2" id="a_ty">${Object.entries(ATYPES).map(([k,[ic,t]])=>`<button class="mini ${k===window._aty?'':'sec'}" data-k="${k}" ${id!=='new'?'disabled':''} onclick="window._aty='${k}';document.querySelectorAll('#a_ty button').forEach(b=>b.classList.toggle('sec',b.dataset.k!=='${k}'));$('#a_tdc').style.display='${k}'==='tdc'?'':'none';$('#a_dep').style.display='${k}'==='tdc'?'none':''">${ic} ${t}</button>`).join('')}</div>
  <label>Nombre</label><input id="a_name" value="${esc(a.name)}" placeholder="Ej. Nu, TDC BBVA, Vales Sí Vale">
  <label>De quién</label><select id="a_owner"><option value="">🤝 Compartida</option>${people().filter(p=>p!=='Compartido').map(p=>`<option ${a.owner===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
  <div id="a_dep" style="display:${window._aty==='tdc'?'none':''}"><div class="grid2"><div><label>Tope de apartados (opcional)</label><input id="a_tope" type="number" inputmode="decimal" value="${a.tope??''}"></div><div><label>Rendimiento % anual</label><input id="a_rate" type="number" inputmode="decimal" value="${a.rate??''}"></div></div></div>
  <div id="a_tdc" style="display:${window._aty==='tdc'?'':'none'}"><label>Límite de crédito</label><input id="a_lim" type="number" inputmode="decimal" value="${a.limite??''}">
    <div class="grid2"><div><label>Día de corte</label><input id="a_cd" type="number" inputmode="numeric" min="1" max="31" value="${a.corte_day??''}" placeholder="Ej. 5"></div><div><label>Día límite de pago</label><input id="a_pd" type="number" inputmode="numeric" min="1" max="31" value="${a.pago_day??''}" placeholder="Ej. 25"></div></div></div>
  ${id==='new'?`<label id="a_il">${window._aty==='tdc'?'¿Cuánto debes hoy?':'Saldo de hoy'}</label><input id="a_ini" type="number" inputmode="decimal" placeholder="$0">`:''}
  <label>Color</label><div class="chips" id="a_cols">${COLORS.map(c=>`<button class="chip ${c===a.color?'on':''}" style="background:${c};border-color:${c};width:38px;height:38px;padding:0" onclick="window._col='${c}';pickOn('a_cols',this)"></button>`).join('')}</div>
  <button class="full" style="margin-top:14px" onclick="saveAcc('${id}')">Guardar</button>
  ${id!=='new'?`<button class="dg full" style="margin-top:10px" onclick="delAcc('${id}')">🗑 Eliminar cuenta</button>`:''}`);
}
function saveAcc(id){
  const ty=window._aty, tdc=ty==='tdc';
  const row={name:$('#a_name').value.trim(),color:window._col,owner:$('#a_owner').value||null,type:ty,
    tope:tdc?null:num($('#a_tope').value)||null,rate:tdc?null:num($('#a_rate').value)||null,
    limite:tdc?num($('#a_lim').value)||null:null,corte_day:tdc?Math.min(31,parseInt($('#a_cd').value)||0)||null:null,pago_day:tdc?Math.min(31,parseInt($('#a_pd').value)||0)||null:null};
  if(!row.name) return toast('Ponle nombre');
  if(S.accounts.some(x=>x.name===row.name&&x.id!==id)) return toast('Ya hay una cuenta con ese nombre');
  if(id==='new'){ row.id=uuid(); row.sort=S.accounts.length; const ops=[{table:'accounts',action:'insert',row}];
    const ini=num($('#a_ini').value);
    if(ini) ops.push({table:'movements',action:'insert',row:{goal_id:null,kind:'concilia',account:row.name,amount:tdc?-Math.abs(ini):ini,owner:row.owner||defOwner(),date:todayISO(),note:'Saldo inicial'}});
    if(tdc){ const r=ensureCardGoal(row); if(r.op) ops.push(r.op); }
    db(ops); }
  else { const old=S.accounts.find(x=>x.id===id).name, ops=[{table:'accounts',action:'update',row,match:{id}}];
    if(old!==row.name){ ops.push({table:'goals',action:'update',row:{account:row.name},match:{household_id:S.hh.id,account:old}},{table:'movements',action:'update',row:{account:row.name},match:{household_id:S.hh.id,account:old}});
      for(const g of cardGoals(old)) ops.push({table:'goals',action:'update',row:{extra:{...ex(g),card:row.name}},match:{id:g.id}}); }
    db(ops); }
  closeSheet(); toast(tdc&&id==='new'?'✅ Tarjeta lista: sus gastos se apartan solos para pagarla':'✅ Cuenta guardada');
}
function delAcc(id){ const a=S.accounts.find(x=>x.id===id), used=S.goals.filter(g=>g.account===a.name&&!g.archived).length;
  if(used) return toast(`Primero cambia de cuenta ${used} apartado(s) que usan ${a.name}`);
  const hasMov=S.movs.some(m=>m.account===a.name);
  if(!confirm(hasMov?`${a.name} tiene movimientos. Se ocultará pero su historial se queda. ¿Seguir?`:`¿Eliminar ${a.name}?`)) return;
  const ops=[hasMov?{table:'accounts',action:'update',row:{archived:true},match:{id}}:{table:'accounts',action:'delete',match:{id}}];
  for(const g of cardGoals(a.name)) ops.push({table:'goals',action:'update',row:{archived:true},match:{id:g.id}});
  db(ops); closeSheet(); }
// convertir un apartado de tarjeta viejo en tarjeta de verdad
function linkCard(gid){
  const g=goalById(gid), x=ex(g), debt=+x.total||Math.max(0,(+g.target||0)-gst(g).pagCiclo);
  openSheet(`<h1>💳 Convertir en tarjeta</h1><p class="mu" style="margin-top:-6px">Desde ahora, cuando pagues con esta tarjeta la deuda sube sola y el dinero se aparta solo para pagarla.</p>
  <label>Nombre de la tarjeta</label><input id="lk_n" value="${esc(g.name)}">
  <label>¿Cuánto debes hoy en total?</label><input id="lk_d" type="number" inputmode="decimal" value="${debt||''}">
  <label>Límite de crédito (opcional)</label><input id="lk_l" type="number" inputmode="decimal">
  <div class="grid2"><div><label>Día de corte</label><input id="lk_c" type="number" inputmode="numeric" value="${x.fcorte?+x.fcorte.slice(8):''}"></div><div><label>Día límite de pago</label><input id="lk_p" type="number" inputmode="numeric" value="${g.due_date?+g.due_date.slice(8):''}"></div></div>
  <div class="grid2"><div><label>Saldo al último corte</label><input id="lk_cb" type="number" inputmode="decimal" value="${x.corte??''}"></div><div><label>Fecha de ese corte</label><input id="lk_cd" type="date" value="${x.fcorte||''}"></div></div>
  <p class="mu sm">Lo que ya tienes apartado (${money(gst(g).saldo)}) se queda para pagarla. No se borra nada.</p>
  <button class="full" style="margin-top:10px" onclick="saveLink('${gid}')">Convertir</button>`);
}
function saveLink(gid){
  const g=goalById(gid), name=$('#lk_n').value.trim(), debt=num($('#lk_d').value);
  if(!name) return toast('Ponle nombre'); if(S.accounts.some(a=>a.name===name)) return toast('Ya hay una cuenta con ese nombre');
  const past=-sum(S.movs.filter(m=>m.goal_id===gid&&m.kind==='pago').map(m=>m.amount));
  const row={id:uuid(),name,type:'tdc',owner:g.owner&&g.owner!=='Compartido'?g.owner:null,color:'#db2777',sort:S.accounts.length,limite:num($('#lk_l').value)||null,
    corte_day:parseInt($('#lk_c').value)||null,pago_day:parseInt($('#lk_p').value)||null,corte_bal:$('#lk_cb').value===''?null:num($('#lk_cb').value),corte_date:$('#lk_cd').value||null};
  db([{table:'accounts',action:'insert',row},
      {table:'movements',action:'insert',row:{goal_id:null,kind:'concilia',account:name,amount:Math.round((-debt-past)*100)/100,owner:g.owner||defOwner(),date:todayISO(),note:'Deuda inicial'}},
      {table:'goals',action:'update',row:{name,subtype:'tdc',extra:{...ex(g),card:name}},match:{id:gid}}]);
  closeSheet(); toast('💳 Listo: ahora es una tarjeta');
}
// ---------- MOVER entre mis cuentas (retiro de cajero, de Banorte a MP…) ----------
let MV={};
function sheetMover(from){
  const as=moneyAccs().filter(accMine); MV={from:from||(as[0]||{}).name, to:(as.find(a=>a.name!==from)||as[1]||{}).name};
  const ch=(id,key)=>as.map(a=>`<button class="chip ${a.name===MV[key]?'on':''}" onclick="MV.${key}='${esc(a.name)}';pickOn('${id}',this)">${ATYPES[atype(a)][0]} ${esc(a.name)}</button>`).join('');
  openSheet(`<h1 style="text-align:center">🔀 Mover entre mis cuentas</h1><p class="mu" style="text-align:center;margin-top:-6px">Retiro de cajero, de Banorte a Mercado Pago… No es gasto.</p>
  <input id="mv2_amt" class="amt" type="number" inputmode="decimal" placeholder="$0">
  <label>Sale de</label><div class="chips" id="mv_f" style="flex-wrap:wrap">${ch('mv_f','from')}</div>
  <label>Llega a</label><div class="chips" id="mv_t" style="flex-wrap:wrap">${ch('mv_t','to')}</div>
  <div class="grid2"><div><label>Nota</label><input id="mv2_note" placeholder="Ej. cajero"></div><div><label>Fecha</label><input id="mv2_date" type="date" value="${todayISO()}"></div></div>
  <button class="full" style="margin-top:14px" onclick="saveMover()">Mover</button>`);
}
function saveMover(){ const v=num($('#mv2_amt').value); if(v<=0) return toast('Escribe el monto'); if(!MV.from||!MV.to||MV.from===MV.to) return toast('Elige dos cuentas distintas');
  const link=uuid(), date=$('#mv2_date').value||todayISO(), note=$('#mv2_note').value.trim()||null, owner=defOwner();
  db({table:'movements',action:'insert',row:[{kind:'mueve',goal_id:null,account:MV.from,amount:-v,category:MV.to,owner,date,note,link},{kind:'mueve',goal_id:null,account:MV.to,amount:v,category:MV.from,owner,date,note,link}]});
  closeSheet(); toast(`🔀 ${money(v)} de ${MV.from} a ${MV.to}`); }
function addCat(){ const v=$('#newcat').value.trim(); if(!v) return; const c=S.hh.categories||[]; if(c.includes(v)) return toast('Ya existe'); db({table:'households',action:'update',row:{categories:[...c,v]},match:{id:S.hh.id}}); }
function delCat(c){ if(confirm(`¿Quitar la categoría ${c}?`)) db({table:'households',action:'update',row:{categories:(S.hh.categories||[]).filter(x=>x!==c)},match:{id:S.hh.id}}); }
function renameMember(uid){ const v=$('#mn_'+uid).value.trim(); if(!v) return; db({table:'members',action:'update',row:{display_name:v},match:{household_id:S.hh.id,user_id:uid}}); if(uid===S.user.id) S.me=v; toast('✅ Nombre guardado'); }
function ajusteLibre(){ const v=num($('#adj').value); if(!v) return toast('Escribe un monto');
  db({table:'movements',action:'insert',row:{goal_id:null,kind:'ajuste',account:'Efectivo',amount:v,owner:defOwner(),date:todayISO(),note:'Ajuste de saldo libre'}}); toast('✅ Ajustado'); }
function resetTodo(){
  if(!confirm('¿Borrar TODOS los apartados, ingresos y gastos? No se puede deshacer.')) return;
  if(prompt('Escribe BORRAR para confirmar')!=='BORRAR') return toast('Cancelado');
  db([{table:'movements',action:'delete',match:{household_id:S.hh.id}},{table:'goals',action:'delete',match:{household_id:S.hh.id}}]); toast('🧹 Listo, empezamos de cero');
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
