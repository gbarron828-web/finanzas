<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#111827;--mu:#6b7280;--ln:#e8e9f3;--pr:#4f46e5;--prl:#eef2ff;--ok:#10b981;--okl:#d1fae5;--wa:#f59e0b;--wal:#fef3c7;--rd:#ef4444;--rdl:#fee2e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 104px)}
h1{font-size:25px;margin:4px 0 12px;letter-spacing:-.02em}
h2{font-size:13px;margin:0 0 10px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(17,24,39,.05),0 6px 20px rgba(79,70,229,.04)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row+.row{margin-top:10px}
.mu{color:var(--mu);font-size:13px}.b{font-weight:700}.sm{font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--rd)}.warn{color:#b45309}
.hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#0ea5e9 100%);color:#fff;border-radius:24px;padding:20px;margin-bottom:12px;box-shadow:0 10px 30px rgba(79,70,229,.3)}
.hero .mu{color:rgba(255,255,255,.8)}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:4px 0}
.hero .pill{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;flex:1}
.hero .pill b{display:block;font-size:15px}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--pr);transition:width .4s}
.ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}
.item:first-of-type{border-top:0;padding-top:2px}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px}
.st.green{background:var(--okl);color:#047857}.st.yellow{background:var(--wal);color:#92400e}.st.red{background:var(--rdl);color:#b91c1c}.st.done{background:var(--prl);color:var(--pr)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--ln);color:#374151;vertical-align:middle}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
input,select,textarea{font:inherit;width:100%;padding:12px 13px;border:1.5px solid var(--ln);border-radius:13px;background:#fff;color:var(--tx);outline:none}
input:focus,select:focus{border-color:var(--pr)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px;font-weight:600}
button{font:inherit;border:0;border-radius:13px;padding:12px 15px;background:var(--pr);color:#fff;font-weight:650;cursor:pointer}
button.sec{background:var(--prl);color:var(--pr)}
button.gh{background:transparent;color:var(--pr);padding:8px}
button.dg{background:var(--rdl);color:#b91c1c}
button.ok{background:var(--ok)}
button.mini{padding:7px 11px;font-size:14px;border-radius:11px;white-space:nowrap}
button:disabled{opacity:.4}
.full{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:20px;background:#fff;color:var(--tx);font-size:14px;font-weight:600;border:1.5px solid var(--ln)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick button{background:#fff;color:var(--tx);border:1.5px solid var(--ln);padding:10px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.pick button span{font-size:24px}
.pick button.on{border-color:var(--pr);background:var(--prl);color:var(--pr)}
.amt{font-size:34px;font-weight:800;text-align:center;border:0;background:var(--prl);color:var(--pr)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{background:none;color:var(--mu);font-size:11px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;flex:1}
nav button span{font-size:21px}
nav button.on{color:var(--pr)}
nav .fab{flex:none;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:30px;margin:-26px 6px 2px;box-shadow:0 8px 20px rgba(79,70,229,.45);padding:0;justify-content:center}
#sheet{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .box{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto;animation:up .22s ease}
#sheet .grab{width:46px;height:5px;border-radius:5px;background:#cbd5e1;margin:0 auto}
#sheet .shead{position:sticky;top:-10px;margin:-10px -18px 8px;padding:12px 18px 10px;background:#fff;z-index:2;touch-action:none;border-radius:26px 26px 0 0}
#sheet .xbtn{position:absolute;right:12px;top:8px;width:36px;height:36px;border-radius:50%;padding:0;background:var(--bg);color:var(--mu);font-size:16px}
#sheet .box{transition:transform .2s}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:#111827;color:#fff;padding:11px 17px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
.alert{display:flex;gap:10px;align-items:center;background:var(--rdl);color:#991b1b;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px;font-weight:600}
.alert.y{background:var(--wal);color:#92400e}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.2em;font-weight:800;color:var(--pr)}
.hbar{display:flex;align-items:center;gap:10px;margin-top:10px}
.hbar .lb{width:112px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:12px;background:var(--ln);border-radius:8px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:8px}
.hbar .vl{width:74px;text-align:right;font-weight:700;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:18px 8px}
.empty span{font-size:40px;display:block;margin-bottom:6px}
.sect{font-size:13px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px}

.track{position:relative;margin-top:28px}
.pups{position:absolute;bottom:5px;transform:translateX(-100%);display:flex;gap:1px;pointer-events:none}
.pup{width:36px;height:25px;animation:hop .34s ease-in-out infinite alternate}
.pup:nth-child(2){animation-delay:.17s}
.pup .lg{transform-box:fill-box;transform-origin:50% 0;animation:leg .34s ease-in-out infinite alternate}
.pup .lg.b{animation-direction:alternate-reverse}
.pup.sit,.pup.sit .lg{animation:none}
@keyframes hop{to{transform:translateY(-3px)}}
@keyframes leg{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
@media (prefers-reduced-motion:reduce){.pup,.pup .lg{animation:none}}
.st.hint{background:#f1f5f9;color:#475569}
.big{display:flex;gap:14px;align-items:center;text-align:left;padding:16px 18px;border-radius:18px;font-size:16px;width:100%}
.big span{font-size:30px}.big small{display:block;font-weight:500;opacity:.85;font-size:13px;margin-top:2px}
.dgb{background:var(--rd)}
.grid3 button small{font-size:12px;font-weight:600}
#net{margin-bottom:12px}
</style>

<body>
<div id="app"><p class="mu" style="text-align:center;margin-top:40vh">Cargando…</p></div>
<nav id="nav" hidden>
  <button data-t="inicio" onclick="go('inicio')"><span>🏠</span>Inicio</button>

<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="box" id="sbox"><div class="shead"><div class="grab"></div><button class="xbtn" onclick="closeSheet()" aria-label="Cerrar">✕</button></div><div id="sheetBody"></div></div></div>
<div id="toast"></div>
<script>
// ============ CONFIGURACIÓN ============
const SUPABASE_URL = 'https://savkihtjsvzmahcgvygr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_u9vum-h6roZid1UFmpW7Yw_EbZ-srT9';
// =======================================

let sb = null;
const SB_SRCS = ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js'];
const withTimeout = (p,ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
function loadScript(src,ms){ return withTimeout(new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.crossOrigin='anonymous'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }),ms); }
async function loadSB(){
  for(const u of SB_SRCS){ try{ if(!window.supabase) await loadScript(u,9000); if(window.supabase&&window.supabase.createClient) return window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){} }
  return null; }
const S = {user:null, hh:null, me:'', members:[], accounts:[], goals:[], movs:[], who:'Todos', bank:'Todos', tab:'inicio', period:'q', origin:'todo', showDet:false, sim:{}};
const KINDS = {fijo:'Gasto fijo', pago:'Deuda / pago', meta:'Meta de ahorro'};
const CAT_IC = {Gasolina:'⛽',Comida:'🍔',Salidas:'🎉','Súper':'🛒',Casa:'🏠',Salud:'💊',Ropa:'👕',Otro:'📦',Transporte:'🚕',Café:'☕',Regalos:'🎁',Mascotas:'🐶',Escuela:'📚',Antojos:'🍦',Uber:'🚗',Cine:'🎬'};
const EMOJIS = ['🏠','🌐','📱','💧','💡','🔥','📺','🎓','🎄','🏥','🐷','🤝','🔧','🎨','🚗','✈️','💍','👶','🐶','🎁','💳','👴','📚','🏋️','🎮','🛋️','💻','🧾','🎯','💰'];
const COLORS = ['#dc2626','#2563eb','#16a34a','#d97706','#7c3aed','#db2777','#0891b2','#475569'];
const KCOL = {fijo:['#eef2ff','#4f46e5'], pago:['#fff1f2','#e11d48'], meta:['#ecfdf5','#059669']};

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const sum = a => a.reduce((x,y)=>x+(+y||0),0);
const money = n => (n<-0.5?'-':'')+'$'+Math.abs(Math.round(+n||0)).toLocaleString('es-MX');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const iso = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const qEnd = (y,m) => Math.min(30, new Date(y,m,0).getDate());
function todayISO(){ const t=new Date(); return iso(t.getFullYear(),t.getMonth()+1,t.getDate()); }
function fmtD(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+dd} ${MES[m-1]}${+y!==new Date().getFullYear()?' '+y.slice(2):''}`; }
function qOf(d){ const [y,m,day]=d.split('-').map(Number);
  if(day>=qEnd(y,m)) return iso(y,m,qEnd(y,m)); if(day>=15) return iso(y,m,15);
  const pm=m===1?12:m-1, py=m===1?y-1:y; return iso(py,pm,qEnd(py,pm)); }
const currentQ = () => qOf(todayISO());
function shiftQ(q,dir){ let [y,m,d]=q.split('-').map(Number);
  if(dir>0){ if(d===15) return iso(y,m,qEnd(y,m)); m++; if(m>12){m=1;y++;} return iso(y,m,15); }
  if(d!==15) return iso(y,m,15); m--; if(m<1){m=12;y--;} return iso(y,m,qEnd(y,m)); }
function countQ(from,due){ let c=0,x=from; while(x<=due&&c<300){c++;x=shiftQ(x,1);} return c; }
const dayMs = 864e5, toDate = d => new Date(d+'T12:00:00');
const daysBetween = (a,b) => Math.round((toDate(b)-toDate(a))/dayMs);
const freqOf = g => g.freq_months==null ? 1 : +g.freq_months;           // 0 = cada quincena
function addPeriod(d,f){ if(f>0) return addMonths(d,f); const [y,m,dd]=d.split('-').map(Number);
  if(dd<15) return iso(y,m,15); if(dd<qEnd(y,m)) return iso(y,m,qEnd(y,m)); return m===12?iso(y+1,1,15):iso(y,m+1,15); }
const perQ = g => freqOf(g)===0 ? (+g.target||0) : (+g.target||0)/(2*freqOf(g));
function addMonths(d,n){ const [y,m,dd]=d.split('-').map(Number); const t=new Date(y,m-1+n,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return iso(t.getFullYear(),t.getMonth()+1,Math.min(dd,last)); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3000); }
function fail(e){ console.error(e); toast('⚠️ '+(e?.message||String(e))); }
const num = v => parseFloat(String(v??'').replace(/[^0-9.\-]/g,''))||0;
function openSheet(html){ $('#sheetBody').innerHTML=html; $('#sheet').classList.add('show'); }
function closeSheet(){ $('#sheet').classList.remove('show'); $('#sbox').style.transform=''; }
// deslizar hacia abajo para cerrar
(function(){ let y0=null, dy=0; const box=()=>$('#sbox');
  document.addEventListener('touchstart',e=>{ const b=box(); if(!b||!$('#sheet').classList.contains('show')) return;
    if(e.target.closest('.shead')||(b.contains(e.target)&&b.scrollTop<=0&&!e.target.closest('input,select,textarea,.chips'))){ y0=e.touches[0].clientY; dy=0; b.style.transition='none'; } },{passive:true});
  document.addEventListener('touchmove',e=>{ if(y0===null) return; dy=e.touches[0].clientY-y0; if(dy>0) box().style.transform=`translateY(${dy}px)`; },{passive:true});
  document.addEventListener('touchend',()=>{ if(y0===null) return; const b=box(); b.style.transition=''; if(dy>90) closeSheet(); else b.style.transform=''; y0=null; });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
})();
function uuid(){ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }
function pickOn(id,el){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }

// ---------- guardado local + sin internet ----------
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const TBL = {goals:'goals', movements:'movs', accounts:'accounts', members:'members'};
const matches = (r,m) => Object.entries(m).every(([k,v])=>r[k]===v);
const queue = () => LS.get('fin_queue',[]);
function applyLocal(op){
  if(op.table==='households'){ Object.assign(S.hh,op.row); return; }
  const key=TBL[op.table];
  if(op.action==='insert') for(const r of [].concat(op.row)){ if(!S[key].some(x=>x.id===r.id)) S[key].push({created_at:new Date().toISOString(),created_by:S.user?.id,...r}); }
  else if(op.action==='update') S[key].forEach(r=>{ if(matches(r,op.match)) Object.assign(r,op.row); });
  else if(op.action==='delete') S[key]=S[key].filter(r=>!matches(r,op.match));
  if(key==='movs') S.movs.sort((a,b)=>a.date!==b.date?(a.date<b.date?1:-1):((a.created_at||'')<(b.created_at||'')?1:-1));
}
function saveCache(){ if(S.user&&S.hh) LS.set('fin_cache',{user:S.user.id,me:S.me,hh:S.hh,members:S.members,accounts:S.accounts,goals:S.goals,movs:S.movs}); }
function db(ops){
  ops=[].concat(ops);
  for(const op of ops){
    op._id=uuid();
    if(op.action==='insert') op.row=[].concat(op.row).map(r=>({id:uuid(),household_id:S.hh.id,...r}));
    applyLocal(op);
  }
  LS.set('fin_queue',[...queue(),...ops]); saveCache(); render(); flush();
}
const isNetErr = e => !navigator.onLine || /fetch|network|load failed|timeout/i.test(String(e?.message||e));
let flushing=false;
async function flush(){
  if(flushing||!sb) return; flushing=true; let sent=false;
  try{
    let q;
    while((q=queue()).length){
      const op=q[0]; let r;
      try{ const t=sb.from(op.table);
        r = op.action==='insert' ? await t.insert(op.row) : op.action==='update' ? await t.update(op.row).match(op.match) : await t.delete().match(op.match);
      }catch(e){ break; }
      if(r.error){ if(isNetErr(r.error)) break; if(r.error.code!=='23505') toast('⚠️ No se guardó un cambio: '+r.error.message); }
      LS.set('fin_queue',queue().filter(o=>o._id!==op._id)); sent=true;
    }
  } finally { flushing=false; }
  if(sent && !queue().length){ try{ await loadAll(); render(); }catch(e){} } else renderNet();
}
window.addEventListener('online',()=>{ flush(); refresh(); });
window.addEventListener('offline',renderNet);
function renderNet(){ const n=queue().length, el=$('#net'); if(!el) return;
  el.innerHTML = !navigator.onLine ? `📴 Sin internet${n?` · ${n} cambio(s) se subirán solos`:' · trabajando con lo guardado'}` : n ? `🔄 Subiendo ${n} cambio(s)…` : '';
  el.style.display = el.innerHTML ? 'block':'none'; }

// ---------- personas / bancos ----------
const first = n => (n||'').trim().split(' ')[0];
const people = () => [...S.members.map(m=>first(m.display_name)).filter(Boolean),'Compartido'];
const nameOfUser = uid => first((S.members.find(m=>m.user_id===uid)||{}).display_name)||'Compartido';
const meName = () => first(S.me)||'Compartido';
const defOwner = () => S.who!=='Todos'?S.who:meName();
const mine = o => S.who==='Todos' || (o.owner||'Compartido')===S.who;
const movOwner = m => m.owner || nameOfUser(m.created_by);
const movMine = m => S.who==='Todos' || movOwner(m)===S.who;
const goalById = id => S.goals.find(g=>g.id===id);
const acc = n => S.accounts.find(a=>a.name===n);
const accColor = n => (acc(n)||{}).color||'#64748b';
const bankTag = n => `<span class="tag"><i class="dot" style="background:${accColor(n)}"></i>${esc(n)}</span>`;
const accSaved = (n,all) => sum(S.movs.filter(m=>m.goal_id&&m.account===n&&(all||mine(goalById(m.goal_id)||{}))).map(m=>m.amount));
const overflowAcc = () => (S.accounts.find(a=>!+a.tope)||{name:'Banorte'}).name;
const catIc = c => CAT_IC[c]||'💸';

// ---------- cálculos ----------
const inQ = (m,q) => qOf(m.date)===q;
function libre(){ let t=0; for(const m of S.movs){ if(!movMine(m)) continue;
  if(!m.goal_id && m.kind!=='aparta' && m.kind!=='retira') t+=+m.amount;          // ingresos, ajustes, gastos de dinero libre
  else if(m.goal_id && (m.kind==='aparta'||m.kind==='retira')) t-=+m.amount; }    // lo que pasa a / regresa de apartados
  return t; }
const daysLeft = () => Math.max(1, daysBetween(todayISO(), shiftQ(currentQ(),1)));
const sumKind = (k,q,f) => sum(S.movs.filter(m=>m.kind===k&&(!q||inQ(m,q))&&movMine(m)&&(!f||f(m))).map(m=>m.amount));
const ingresadoQ = q => sumKind('ingreso',q);
const apartadoQ = q => sumKind('aparta',q);
const gastadoQ = q => -sumKind('gasto',q);

function gst(g, over){
  const o=over||{}, q=currentQ(), today=todayISO();
  const ms=S.movs.filter(m=>m.goal_id===g.id);
  const saldo=sum(ms.map(m=>m.amount))+(o.extra||0);
  const pagado=-sum(ms.filter(m=>m.kind==='pago').map(m=>m.amount));
  const lastPago=ms.filter(m=>m.kind==='pago'&&inQ(m,q)).sort((a,b)=>(a.created_at||'')<(b.created_at||'')?1:-1)[0];
  const aportQ=sum(ms.filter(m=>m.kind==='aparta'&&inQ(m,q)&&(!lastPago||(m.created_at||'')>(lastPago.created_at||''))).map(m=>m.amount))+(o.extra||0);
  const target=+g.target||0, due=o.due!==undefined?o.due:g.due_date;
  let avance,falta,n=0,cuota=0,pend=0,pct=0,st='',stc='hint';
  const cyc=g.cycle_from||g.created_at||'';
  const pagCiclo=-sum(ms.filter(m=>m.kind==='pago'&&(m.created_at||'')>cyc).map(m=>m.amount));
  if(g.kind==='fijo'){
    const porPagar=Math.max(0,target-pagCiclo);
    avance=saldo+pagCiclo; falta=Math.max(0,porPagar-saldo);
    n=due?countQ(q,due):Math.max(1,2*freqOf(g));
    const base=Math.max(0,porPagar-(saldo-aportQ)); cuota=n>0?base/n:base; pend=Math.max(0,Math.min(falta,cuota-aportQ));
    pct=target?Math.min(100,avance/target*100):0;
    const dl=due?daysBetween(today,due):null;
    if(target&&porPagar<=0.5){st='Pagado este periodo ✓';stc='done';}
    else if(target&&saldo>=porPagar-0.5){st=pagCiclo>0.5?`Listo para pagar el resto (${money(porPagar)}) ✓`:'Listo para pagar ✓';stc='done';}
    else if(dl!==null&&dl<0){st=`Vencido · faltan ${money(falta)}`;stc='red';}
    else if(dl!==null&&dl<=5){st=`Vence en ${dl} d · faltan ${money(falta)}`;stc='red';}
    else if(pend>0.5){st=`Sugerido ${money(pend)} esta quincena`;}
    else {st='Al corriente';stc='green';}
  } else {
    avance=g.kind==='pago'?saldo+pagado:saldo; falta=Math.max(0,target-avance);
    if(target&&due){ n=countQ(q,due); const base=Math.max(0,falta+aportQ); cuota=n>0?base/n:base; pend=Math.max(0,cuota-aportQ); }
    else if(+g.cuota){ cuota=+g.cuota; pend=Math.max(0,cuota-aportQ); if(target) pend=Math.min(pend,falta); }
    pct=target?Math.min(100,avance/target*100):0;
    if(target&&falta<=0.5){st='Cumplida 🎉';stc='done';}
    else if(due&&due<today){st=`Vencida · faltan ${money(falta)}`;stc='red';}
    else if(pend>0.5){st=`Sugerido ${money(pend)} esta quincena`;}
    else if(cuota){st='Al corriente';stc='green';}
    else {st=target?`Faltan ${money(falta)}`:'Sin meta';}
  }
  return {saldo,pagado,pagCiclo,aportQ,avance,falta,n,cuota,pend,pct,st,stc,due};
}

function useCache(c){
  Object.assign(S,{hh:c.hh,me:c.me,members:c.members||[],accounts:c.accounts||[],goals:c.goals||[],movs:c.movs||[]});
  if(!S.user) S.user={id:c.user};

function vNoConn(msg){ $('#nav').hidden=true; $('#app').innerHTML=`<div class="empty" style="margin-top:28vh"><span>📶</span>${msg}<br><button style="margin-top:14px" onclick="location.reload()">Reintentar</button></div>`; }
async function boot(){
  const cache=LS.get('fin_cache',null);
  if(cache&&!S.hh) useCache(cache);                       // abre al instante con lo guardado
  const slow=setTimeout(()=>{ if(!S.hh) vNoConn('La conexión está lenta o no hay señal.'); },12000);
  if(!sb) sb=await loadSB();
  if(!sb){ clearTimeout(slow); if(!S.hh) vNoConn('No se pudo conectar. La primera vez necesitas señal.'); else renderNet(); return; }
  let session=null, sesOk=true;
  try{ ({data:{session}}=await withTimeout(sb.auth.getSession(),8000)); }catch(e){ sesOk=false; }
  if(!session&&!sesOk){ clearTimeout(slow); if(!S.hh) vNoConn('La conexión está lenta o no hay señal.'); else renderNet(); return; }
  S.user=session?.user||null;
  if(!S.user){ clearTimeout(slow); if(cache&&!navigator.onLine) return useCache(cache); return vLogin(); }
  if(cache&&cache.user===S.user.id&&!S.hh) useCache(cache);
  try{
    const {data:mem,error}=await withTimeout(sb.from('members').select('household_id,display_name').eq('user_id',S.user.id).limit(1),10000);
    if(error) throw error;
    clearTimeout(slow);
    if(!mem.length) return vHousehold();
    S.hh={...(S.hh||{}),id:mem[0].household_id}; S.me=mem[0].display_name||'';
    await withTimeout(loadAll(),15000); render(); flush();
  }catch(e){ clearTimeout(slow); if(!S.hh) vNoConn('No se pudieron traer tus datos. Revisa tu señal.'); else renderNet(); }
}
async function loadAll(){
  const h=S.hh.id;
  const r=await Promise.all([
    sb.from('households').select('*').eq('id',h).single(),
    sb.from('goals').select('*').eq('household_id',h).order('sort').order('created_at'),
    sb.from('movements').select('*').eq('household_id',h).order('date',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('members').select('user_id,display_name').eq('household_id',h),
    sb.from('accounts').select('*').eq('household_id',h).order('sort').order('created_at')
  ]);
  for(const x of r) if(x.error) throw x.error;
  [S.hh,S.goals,S.movs,S.members,S.accounts]=r.map(x=>x.data);
  for(const op of queue()) applyLocal(op);
  saveCache();
}

  <p class="mu">${esc(movLabel(m))} · ${fmtD(m.date)} · ${esc(m.account)} · ${esc(movOwner(m))}${m.note?'<br>'+esc(m.note):''}</p></div>
  <div class="grid2"><button class="sec" onclick="closeSheet()">Cerrar</button><button class="dg" onclick="delMov('${m.id}')">🗑 Borrar</button></div>`);
}
function delMov(id){ if(!confirm('¿Borrar este movimiento?')) return; db({table:'movements',action:'delete',match:{id}}); closeSheet(); toast('Borrado'); }
function movIcon(m){ const g=goalById(m.goal_id); return m.kind==='trans_out'||m.kind==='trans_in'?'🔁':m.kind==='ingreso'?'💵':m.kind==='gasto'?catIc(m.category):m.kind==='pago'?'💳':m.kind==='retira'?'↩️':m.kind==='ajuste'?'⚖️':(g?.icon||'🎯'); }
function movLabel(m){ const g=goalById(m.goal_id);
  if(m.kind==='ingreso') return 'Ingreso'+(m.category?' · '+m.category:'');
  if(m.kind==='gasto') return (m.category||'Gasto')+(g?' · de '+g.name:'');
  if(m.kind==='aparta') return 'Apartado a '+(g?.name||'—');
  if(m.kind==='retira') return 'Sacado de '+(g?.name||'—');
  if(m.kind==='pago') return 'Pago de '+(g?.name||'—');
  if(m.kind==='trans_out') return 'Transferencia a '+(m.category||'—')+(g?' · de '+g.name:'');
  if(m.kind==='trans_in') return 'Transferencia de '+(m.category||'—');
  return 'Ajuste de dinero libre'; }
function movRow(m){
  return `<div class="item" onclick="sheetMov('${m.id}')" style="cursor:pointer"><div class="ic" style="background:${m.kind==='ingreso'?'var(--okl)':m.kind==='gasto'?'#fff7ed':'var(--prl)'}">${movIcon(m)}</div>

    <div class="mu">${fmtD(m.date)} · ${esc(m.account)}${S.who==='Todos'?' · '+esc(movOwner(m)):''}</div></div></div>`;
}

function goalRow(g, opts={}){

  const sub=g.kind==='fijo'?((s.pagCiclo>0.5&&s.pagCiclo<(+g.target||0)-0.5?`Pagado ${money(s.pagCiclo)} · `:'')+(s.due?`Paga ${fmtD(s.due)}`:'Sin fecha de pago')):(s.due?`Meta ${fmtD(s.due)}`:(+g.cuota?`${money(g.cuota)} por quincena`:''));

      <div class="row" style="margin-top:6px"><span class="st ${s.stc}">${s.st}</span><span class="mu">${sub}</span></div>

    <div class="grid2" style="margin-top:14px"><button class="ok" onclick="sheetIngreso()">💵 Ingresar</button><button onclick="go('apartados');setTimeout(()=>sheetEdit('new'),60)">🎯 Crear apartado</button></div></div>`:''}

}

function sheetGoal(id){ const g=goalById(id); openSheet(`${goalRow(g)}${goalActions(g)}${historyOf(g)}`); }
function historyOf(g){

function sheetMove(id,kind){
  const g=goalById(id), s=gst(g);
  const title={aparta:'＋ Meter dinero',retira:'↩ Sacar dinero',pago:'💳 Registrar pago'}[kind];
  const porPagar=g.kind==='fijo'?Math.max(0,(+g.target||0)-s.pagCiclo):0;
  const def=kind==='pago'?(g.kind==='fijo'?Math.min(Math.max(0,s.saldo),porPagar||s.saldo):Math.max(0,s.saldo)):0;
  openSheet(`<h1>${esc(g.icon||'')} ${esc(g.name)}</h1><div class="mu" style="margin-top:-6px">${title} · saldo ${money(s.saldo)}</div>
  <input id="mv_amt" class="amt" style="margin-top:14px" type="number" inputmode="decimal" value="${def>0?Math.round(def):''}" placeholder="${kind==='aparta'&&s.pend>0.5?Math.round(s.pend):'$0'}">
  ${kind==='aparta'?`<p class="mu">Sale de tu dinero sin repartir (${money(libre())}).${s.pend>0.5?' Vacío = sugerido '+money(s.pend)+'.':''}</p>`:''}
  ${kind==='retira'?`<p class="mu">El dinero que saques regresa a tu <b>saldo libre</b>.</p>`:''}
  ${kind==='pago'?`<p class="mu">Se descuenta de este apartado, no de tu saldo libre. Puedes pagar en partes.</p>
    ${g.kind==='fijo'?`<div class="card" style="background:var(--bg);box-shadow:none;padding:12px"><div class="row sm"><span>Este periodo</span><b>Pagado ${money(s.pagCiclo)} de ${money(g.target)}</b></div>
      <label style="display:flex;gap:10px;align-items:center;margin:10px 0 0;color:var(--tx)"><input id="mv_done" type="checkbox" style="width:22px;height:22px" ${def>=porPagar-0.5?'checked':''}>
      <span>Ya quedó liquidado${g.due_date?`: pasar al siguiente pago (<b>${fmtD(addPeriod(g.due_date,freqOf(g)))}</b>)`:''}</span></label></div>`:''}`:''}
  <div class="grid2"><div><label>Nota</label><input id="mv_note" placeholder="Opcional"></div><div><label>Fecha</label><input id="mv_date" type="date" value="${todayISO()}"></div></div>
  <button class="full ${kind==='pago'?'ok':''}" style="margin-top:16px" onclick="saveMove('${id}','${kind}')">Guardar</button>`);
}
function saveMove(id,kind){
  const g=goalById(id), v=num($('#mv_amt').value)||(kind==='aparta'?Math.round(gst(g).pend):0); if(v<=0) return toast('Escribe un monto');
  if(kind==='aparta'){ if(!doApartar(g,v)) return; }
  else { const ops=[{table:'movements',action:'insert',row:apartarOps(g,v,kind,$('#mv_note').value.trim(),$('#mv_date').value)}];
    if(kind==='pago'&&g.kind==='fijo'&&($('#mv_done')?.checked || gst(g).pagCiclo+v>=(+g.target||0)-0.5)){
      const row={cycle_from:new Date(Date.now()+120000).toISOString()}; if(g.due_date) row.due_date=addPeriod(g.due_date,freqOf(g));
      ops.push({table:'goals',action:'update',row,match:{id}}); }
    db(ops); }
  closeSheet(); toast(kind==='pago'?`💳 Pago de ${money(v)} registrado${g.kind==='fijo'&&!$('#mv_done')?.checked&&gst(g).falta>0.5?' · pago parcial':''}`:kind==='retira'?`↩ ${money(v)} regresaron a tu saldo libre`:`✅ ${money(v)} a ${g.name}`);
}

  window._ic=g.icon||'🎯';
  openSheet(`<h1>${id==='new'?'Nuevo apartado':'Editar'}</h1>
  <label>Tipo</label><div class="grid3" id="e_kind">${Object.keys(KINDS).map(k=>`<button class="mini ${g.kind===k?'':'sec'}" data-k="${k}" onclick="setKind('${k}')">${{fijo:'📆 Fijo',pago:'🤝 Deuda',meta:'🎯 Meta'}[k]}</button>`).join('')}</div>
  <input type="hidden" id="e_k" value="${g.kind}">
  <p class="mu sm" id="e_help" style="margin:8px 0 0">${kindHelp(g.kind)}</p>
  <label>Ícono</label><div class="chips" id="e_ics" style="flex-wrap:wrap">${EMOJIS.map(e=>`<button class="chip ${e===window._ic?'on':''}" style="padding:6px 9px;font-size:20px" onclick="window._ic='${e}';pickOn('e_ics',this)">${e}</button>`).join('')}</div>
  <label>Nombre</label><input id="e_name" value="${esc(g.name)}" placeholder="Ej. Internet">
  <div class="grid2"><div><label id="e_tl">${g.kind==='fijo'?'Monto a pagar':'Meta total'}</label><input id="e_target" type="number" inputmode="decimal" value="${g.target??''}"></div>
  <div><label id="e_dl">${g.kind==='fijo'?'Próximo pago':'Fecha meta'}</label><input id="e_due" type="date" value="${g.due_date??''}"></div></div>
  <div class="grid2"><div id="e_freqw" style="${g.kind==='fijo'?'':'display:none'}"><label>Cada cuánto</label><select id="e_freq">${[[0,'Cada quincena'],[1,'Cada mes'],[2,'Cada 2 meses'],[3,'Cada 3 meses'],[6,'Cada 6 meses'],[12,'Cada año']].map(([n,t])=>`<option value="${n}" ${freqOf(g)===n?'selected':''}>${t}</option>`).join('')}</select></div>
  <div id="e_cuw" style="${g.kind==='fijo'?'display:none':''}"><label>Cuota fija (opcional)</label><input id="e_cuota" type="number" inputmode="decimal" value="${g.cuota??''}" placeholder="Si no hay fecha"></div>
  <div><label>Banco</label><select id="e_acc">${S.accounts.map(a=>`<option ${g.account===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div></div>
  <label>De quién</label><select id="e_owner">${people().map(p=>`<option ${g.owner===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
  <button class="full" style="margin-top:16px" onclick="saveGoal('${id}')">Guardar</button>
  ${id!=='new'?`<div class="grid2" style="margin-top:10px"><button class="sec" onclick="archiveGoal('${id}')">🗄 Archivar</button><button class="dg" onclick="delGoal('${id}')">🗑 Borrar</button></div>${historyOf(g)}`:''}`);
}
const kindHelp = k => ({fijo:'Algo que pagas cada cierto tiempo: renta, internet, luz, tarjeta de crédito al corte. Pon cuánto y cuándo pagas; puedes pagarlo en partes.',pago:'Algo que debes: préstamo, mecánico. Pon cuánto debes y para cuándo.',meta:'Algo para lo que ahorras: Navidad, fondo médico. Pon cuánto quieres juntar y para cuándo.'})[k];
function setKind(k){ $('#e_k').value=k; document.querySelectorAll('#e_kind button').forEach(b=>b.classList.toggle('sec',b.dataset.k!==k));
  $('#e_help').textContent=kindHelp(k); $('#e_tl').textContent=k==='fijo'?'Monto a pagar':k==='pago'?'Cuánto debes':'Meta total'; $('#e_dl').textContent=k==='fijo'?'Próximo pago':'Fecha meta';
  $('#e_freqw').style.display=k==='fijo'?'':'none'; $('#e_cuw').style.display=k==='fijo'?'none':''; }
function saveGoal(id){
  const row={kind:$('#e_k').value,icon:window._ic,name:$('#e_name').value.trim(),target:num($('#e_target').value)||null,
    due_date:$('#e_due').value||null,freq_months:$('#e_freq').value===''?1:+$('#e_freq').value,cuota:num($('#e_cuota').value)||null,account:$('#e_acc').value,owner:$('#e_owner').value};
  if(!row.name) return toast('Ponle nombre');
  if(row.kind==='fijo'&&!row.target) return toast('Pon el monto a pagar');
  if(id==='new'){ row.sort=S.goals.length; db({table:'goals',action:'insert',row}); } else db({table:'goals',action:'update',row,match:{id}});
  closeSheet(); toast('✅ Guardado');
}
function archiveGoal(id){ db({table:'goals',action:'update',row:{archived:true},match:{id}}); closeSheet(); }
function delGoal(id){ const g=goalById(id), s=gst(g);
  if(!confirm(`¿Borrar "${g.name}" con todo su historial?${s.saldo>0.5?` Sus ${money(s.saldo)} regresan a tu saldo libre.`:''}`)) return;
  db([{table:'movements',action:'delete',match:{goal_id:id}},{table:'goals',action:'delete',match:{id}}]); closeSheet(); toast('Borrado'); }

// ---------- ANÁLISIS ----------
function periodRange(p){
  const t=todayISO(), [y,m]=t.split('-').map(Number);
  if(p==='q'){ const q=currentQ(), pq=shiftQ(q,-1), e=new Date(toDate(q)-dayMs); return {a:q,b:t,pa:pq,pb:iso(e.getFullYear(),e.getMonth()+1,e.getDate()),lbl:'esta quincena'}; }
  if(p==='m'){ const pm=m===1?12:m-1, py=m===1?y-1:y; return {a:iso(y,m,1),b:t,pa:iso(py,pm,1),pb:iso(py,pm,new Date(py,pm,0).getDate()),lbl:'este mes'}; }
  const pm=m===1?12:m-1, py=m===1?y-1:y, p2=pm===1?12:pm-1, y2=pm===1?py-1:py;
  return {a:iso(py,pm,1),b:iso(py,pm,new Date(py,pm,0).getDate()),pa:iso(y2,p2,1),pb:iso(y2,p2,new Date(y2,p2,0).getDate()),lbl:'el mes pasado'};
}
const inRange = (m,a,b) => m.date>=a&&m.date<=b;
const originOk = m => S.origin==='todo' || (S.origin==='libre'?!m.goal_id:!!m.goal_id);
function hbars(rows,max){ return rows.map(([lb,v,ic,col])=>`<div class="hbar"><span class="lb">${ic||''} ${esc(lb)}</span><span class="tr"><i style="width:${max?Math.max(2,v/max*100):0}%;background:${col}"></i></span><span class="vl">${money(v)}</span></div>`).join(''); }
const PAL = ['#4f46e5','#7c3aed','#0ea5e9','#10b981','#f59e0b','#ef4444','#db2777','#64748b'];
function group(ms,key){ const o={}; for(const m of ms){ const k=key(m); o[k]=(o[k]||0)+Math.abs(+m.amount); } return Object.entries(o).sort((x,y)=>y[1]-x[1]); }
function vAnalisis(){
  const R=periodRange(S.period);
  const gs=S.movs.filter(m=>m.kind==='gasto'&&movMine(m)&&originOk(m)&&inRange(m,R.a,R.b));
  const prevG=S.movs.filter(m=>m.kind==='gasto'&&movMine(m)&&originOk(m)&&inRange(m,R.pa,R.pb));
  const tot=-sum(gs.map(m=>m.amount)), prev=-sum(prevG.map(m=>m.amount)), diff=prev?((tot-prev)/prev*100):null;
  const cats=group(gs,m=>m.category||'Otro'), accs=group(gs,m=>m.account), srcs=group(gs,m=>m.goal_id?(goalById(m.goal_id)?.name||'Apartado'):'Dinero libre');
  const ins=S.movs.filter(m=>m.kind==='ingreso'&&movMine(m)&&inRange(m,R.a,R.b)), tin=sum(ins.map(m=>m.amount));
  const apt=sum(S.movs.filter(m=>m.kind==='aparta'&&movMine(m)&&inRange(m,R.a,R.b)).map(m=>m.amount));
  const trn=sum(S.movs.filter(m=>(m.kind==='trans_in'||(m.kind==='trans_out'&&!m.goal_id))&&movMine(m)&&inRange(m,R.a,R.b)).map(m=>m.amount));
  const gLibre=-sum(S.movs.filter(m=>m.kind==='gasto'&&!m.goal_id&&movMine(m)&&inRange(m,R.a,R.b)).map(m=>m.amount));
  // compromiso: lo que piden los apartados vs ingreso promedio de las últimas 4 quincenas
  const cuotas=sum(activeGoals().map(g=>{ const s=gst(g); return g.kind==='fijo'?perQ(g):(s.falta>0.5?s.cuota:0); }));
  let qs=[],q=currentQ(); for(let i=0;i<4;i++){ q=shiftQ(q,-1); qs.push(q); }
  const qsWith=qs.filter(x=>ingresadoQ(x)>0); const prom=qsWith.length?sum(qsWith.map(ingresadoQ))/qsWith.length:ingresadoQ(currentQ());
  const sg=goalById(S.sim.id)||activeGoals().find(g=>g.kind!=='fijo')||activeGoals()[0];
  return `<h1>Análisis 📊</h1>${whoBar()}
  <div class="chips">${[['q','Esta quincena'],['m','Este mes'],['pm','Mes pasado']].map(([k,t])=>`<button class="chip ${S.period===k?'on':''}" onclick="S.period='${k}';render()">${t}</button>`).join('')}</div>
  <div class="card"><h2>💸 Gastos · ${R.lbl}</h2>
    <div class="chips" style="margin-bottom:8px">${[['todo','Todo'],['libre','💸 Dinero libre'],['apartados','🎯 De apartados']].map(([k,t])=>`<button class="chip ${S.origin===k?'on':''}" style="padding:6px 11px;font-size:13px" onclick="S.origin='${k}';render()">${t}</button>`).join('')}</div>
    <div style="font-size:34px;font-weight:800">${money(tot)}</div>
    ${diff!==null?`<div class="mu">${diff>0?'🔺':'🔻'} ${Math.abs(Math.round(diff))}% vs periodo anterior (${money(prev)})</div>`:'<div class="mu">Sin datos del periodo anterior para comparar</div>'}
    ${cats.length?`<div class="sect" style="margin:14px 0 0">Por categoría</div>${hbars(cats.map(([c,v],i)=>[c,v,catIc(c),PAL[i%PAL.length]]),cats[0][1])}
      ${S.origin==='todo'&&srcs.length>1?`<div class="sect" style="margin:14px 0 0">De dónde salió</div>${hbars(srcs.map(([c,v])=>[c,v,c==='Dinero libre'?'💸':'🎯',c==='Dinero libre'?'#10b981':'#7c3aed']),srcs[0][1])}`:''}
      <div class="sect" style="margin:14px 0 0">Cómo pagaste</div>${hbars(accs.map(([n,v])=>[n,v,'',accColor(n)]),accs[0][1])}
      <button class="gh full" style="margin-top:10px" onclick="S.showDet=!S.showDet;render()">${S.showDet?'Ocultar detalle':`Ver detalle (${gs.length})`}</button>
      ${S.showDet?gs.map(movRow).join(''):''}`:'<div class="empty"><span>🧾</span>No hay gastos en este periodo</div>'}</div>
  <div class="card"><h2>💵 Ingresos · ${R.lbl}</h2><div style="font-size:28px;font-weight:800" class="pos">${money(tin)}</div>
    ${ins.length?`<div class="sect" style="margin:12px 0 0">Por persona</div>${hbars(group(ins,movOwner).map(([n,v],i)=>[n,v,'👤',PAL[(i+3)%PAL.length]]),group(ins,movOwner)[0][1])}
      <div class="sect" style="margin:12px 0 0">Por concepto</div>${hbars(group(ins,m=>m.category||'Sin concepto').map(([n,v],i)=>[n,v,'💵','#10b981']),group(ins,m=>m.category||'Sin concepto')[0][1])}`:'<p class="mu">Sin ingresos en este periodo</p>'}</div>
  <div class="card"><h2>⚖️ Balance · ${R.lbl}</h2>
    <div class="row"><span>💵 Ingresaste</span><b class="pos">${money(tin)}</b></div>
    <div class="row"><span>🎯 Apartaste</span><b>${money(-apt)}</b></div>
    <div class="row"><span>💸 Gastaste de dinero libre</span><b class="neg">${money(-gLibre)}</b></div>
    ${Math.abs(trn)>0.5?`<div class="row"><span>🔁 Transferencias (neto)</span><b class="${trn<0?'neg':'pos'}">${money(trn)}</b></div>`:''}
    <div class="row" style="border-top:1px solid var(--ln);padding-top:10px"><span class="b">Te sobró</span><b class="${tin-apt-gLibre+trn<0?'neg':'pos'}">${money(tin-apt-gLibre+trn)}</b></div></div>
  <div class="card"><h2>🔮 ¿Te alcanza?</h2>
    <div class="row"><span>Tus apartados piden por quincena</span><b>${money(cuotas)}</b></div>
    <div class="row"><span>Tu ingreso promedio por quincena</span><b>${money(prom)}</b></div>
    <div class="bar" style="height:12px;display:flex"><i style="width:${prom?Math.min(100,cuotas/prom*100):0}%;background:#7c3aed;border-radius:8px 0 0 8px"></i><i style="width:${prom?Math.max(0,100-cuotas/prom*100):0}%;background:#10b981;border-radius:0 8px 8px 0"></i></div>
    <div class="row" style="margin-top:10px"><span class="b">Te quedaría libre</span><b class="${prom-cuotas<0?'neg':'pos'}">${money(prom-cuotas)} ≈ ${money(Math.max(0,prom-cuotas)/15)}/día</b></div>
    <p class="mu sm" style="margin-bottom:0">${qsWith.length?`Promedio de tus últimas ${qsWith.length} quincena(s) con ingresos.`:'Con lo que ingresaste esta quincena; se afina con el tiempo.'}</p></div>
  ${sg?vSim(sg):''}`;
}
function vSim(g){
  const s=gst(g), o={due:S.sim.due||g.due_date, extra:+S.sim.extra||0}, n=gst(g,o), dl=daysLeft(), l=libre(), l2=l-o.extra;
  return `<div class="card"><h2>🧪 Simulador · ¿qué pasa si…?</h2>
    <label>Apartado</label><select onchange="S.sim={id:this.value};render()">${activeGoals().map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.icon||'')} ${esc(x.name)}</option>`).join('')}</select>
    <div class="grid2"><div><label>Meter extra hoy</label><input type="number" inputmode="decimal" value="${S.sim.extra||''}" placeholder="$0" onchange="S.sim.id='${g.id}';S.sim.extra=num(this.value);render()"></div>
    <div><label>${g.kind==='fijo'?'Próximo pago':'Nueva fecha'}</label><input type="date" value="${o.due||''}" onchange="S.sim.id='${g.id}';S.sim.due=this.value;render()"></div></div>
    <div class="grid2" style="margin-top:14px;text-align:center">
      <div style="background:var(--bg);border-radius:14px;padding:10px"><div class="mu">Hoy</div><div class="b">${money(s.cuota)}/quincena</div><div class="mu sm">libre ${money(l/dl)}/día</div></div>
      <div style="background:var(--prl);border-radius:14px;padding:10px"><div class="mu">Con el cambio</div><div class="b" style="color:var(--pr)">${money(n.cuota)}/quincena</div><div class="mu sm">libre ${money(l2/dl)}/día</div></div></div>
    <p class="mu sm" style="margin-bottom:0">${n.falta<=0.5&&+g.target?'🎉 Con eso la cumples.':n.cuota<s.cuota-0.5?`Te libera ${money(s.cuota-n.cuota)} cada quincena.`:n.cuota>s.cuota+0.5?`Necesitarías ${money(n.cuota-s.cuota)} más cada quincena.`:'Sin cambio en la cuota.'}</p>
    ${S.sim.extra||S.sim.due?`<button class="gh mini" onclick="S.sim={id:'${g.id}'};render()">Limpiar</button>`:''}</div>`;
}

// ---------- CONFIGURACIÓN ----------
function vConfig(){
  const cats=S.hh.categories||[];
  return `<div class="row"><h1>⚙️ Configuración</h1><button class="sec mini" onclick="go('inicio')">‹ Volver</button></div>
  <img src="logo.svg" alt="Finanzas con Lia y Ted" style="width:100%;display:block;margin-bottom:12px">
  <div class="card"><div class="row"><h2 style="margin:0">🏦 Bancos</h2><button class="mini" onclick="sheetAcc('new')">＋ Agregar</button></div>
    ${S.accounts.map(a=>`<div class="item" onclick="sheetAcc('${a.id}')" style="cursor:pointer"><div class="ic" style="background:${a.color}22;color:${a.color}">🏦</div><div class="grow"><div class="row"><span class="nm">${esc(a.name)}</span><b>${money(accSaved(a.name,true))}</b></div>
      <div class="mu">${+a.tope?'Tope '+money(a.tope):'Sin tope'}${+a.rate?' · '+(+a.rate)+'% anual':''}</div></div></div>`).join('')}</div>
  <div class="card"><h2>🏷 Categorías de gasto</h2><div class="chips" style="flex-wrap:wrap">${cats.map(c=>`<button class="chip" onclick="delCat('${esc(c)}')">${catIc(c)} ${esc(c)} ✕</button>`).join('')}</div>
    <div class="row"><input id="newcat" placeholder="Nueva categoría (ej. Cine)"><button class="mini" onclick="addCat()">Agregar</button></div></div>
  <div class="card"><h2>👥 Personas</h2>${S.members.map(m=>`<div class="row"><input id="mn_${m.user_id}" value="${esc(m.display_name||'')}"><button class="mini sec" onclick="renameMember('${m.user_id}')">Guardar</button></div>`).join('')}
    <div class="row" style="margin-top:14px"><span>Código para invitar</span><span class="code">${esc(S.hh.invite_code)}</span></div></div>
  <div class="card"><h2>⚖️ Cuadrar saldo libre</h2><p class="mu" style="margin-top:0">Si tu dinero libre real no coincide con la app, suma o resta la diferencia.</p>
    <div class="row"><input id="adj" type="number" inputmode="decimal" placeholder="Monto (+ o −)"><button class="mini" onclick="ajusteLibre()">Ajustar</button></div></div>
  <div class="card"><h2>🧹 Empezar de cero</h2><p class="mu" style="margin-top:0">Borra todos los apartados, ingresos y gastos${S.who!=='Todos'?'':' de los dos'}. Bancos, categorías y personas se quedan.</p>
    <button class="dg full" onclick="resetTodo()">Borrar todo</button></div>
  <button class="sec full" onclick="logout()">Cerrar sesión</button>`;
}
function sheetAcc(id){
  const a=id==='new'?{color:COLORS[S.accounts.length%COLORS.length]}:S.accounts.find(x=>x.id===id); window._col=a.color;
  openSheet(`<h1>${id==='new'?'Nuevo banco':'Editar banco'}</h1>
  <label>Nombre</label><input id="a_name" value="${esc(a.name)}" placeholder="Ej. Nu">
  <div class="grid2"><div><label>Tope (opcional)</label><input id="a_tope" type="number" inputmode="decimal" value="${a.tope??''}"></div><div><label>Rendimiento % anual</label><input id="a_rate" type="number" inputmode="decimal" value="${a.rate??''}"></div></div>
  <label>Color</label><div class="chips" id="a_cols">${COLORS.map(c=>`<button class="chip ${c===a.color?'on':''}" style="background:${c};border-color:${c};width:38px;height:38px;padding:0" onclick="window._col='${c}';pickOn('a_cols',this)"></button>`).join('')}</div>
  <button class="full" style="margin-top:14px" onclick="saveAcc('${id}')">Guardar</button>
  ${id!=='new'?`<button class="dg full" style="margin-top:10px" onclick="delAcc('${id}')">🗑 Eliminar banco</button>`:''}`);
}
function saveAcc(id){
  const row={name:$('#a_name').value.trim(),tope:num($('#a_tope').value)||null,rate:num($('#a_rate').value)||null,color:window._col};
  if(!row.name) return toast('Ponle nombre');
  if(id==='new'){ row.sort=S.accounts.length; db({table:'accounts',action:'insert',row}); }
  else { const old=S.accounts.find(x=>x.id===id).name, ops=[{table:'accounts',action:'update',row,match:{id}}];
    if(old!==row.name) ops.push({table:'goals',action:'update',row:{account:row.name},match:{household_id:S.hh.id,account:old}},{table:'movements',action:'update',row:{account:row.name},match:{household_id:S.hh.id,account:old}});
    db(ops); }
  closeSheet(); toast('✅ Banco guardado');
}
function delAcc(id){ const a=S.accounts.find(x=>x.id===id), used=S.goals.filter(g=>g.account===a.name).length;
  if(used) return toast(`Primero cambia de banco ${used} apartado(s) que usan ${a.name}`);
  if(!confirm(`¿Eliminar ${a.name}?`)) return; db({table:'accounts',action:'delete',match:{id}}); closeSheet(); }
function addCat(){ const v=$('#newcat').value.trim(); if(!v) return; const c=S.hh.categories||[]; if(c.includes(v)) return toast('Ya existe'); db({table:'households',action:'update',row:{categories:[...c,v]},match:{id:S.hh.id}}); }
function delCat(c){ if(confirm(`¿Quitar la categoría ${c}?`)) db({table:'households',action:'update',row:{categories:(S.hh.categories||[]).filter(x=>x!==c)},match:{id:S.hh.id}}); }
function renameMember(uid){ const v=$('#mn_'+uid).value.trim(); if(!v) return; db({table:'members',action:'update',row:{display_name:v},match:{household_id:S.hh.id,user_id:uid}}); if(uid===S.user.id) S.me=v; toast('✅ Nombre guardado'); }
function ajusteLibre(){ const v=num($('#adj').value); if(!v) return toast('Escribe un monto');
  db({table:'movements',action:'insert',row:{goal_id:null,kind:'ajuste',account:'Efectivo',amount:v,owner:defOwner(),date:todayISO(),note:'Ajuste de saldo libre'}}); toast('✅ Ajustado'); }
function resetTodo(){
  if(!confirm('¿Borrar TODOS los apartados, ingresos y gastos? No se puede deshacer.')) return;
  if(prompt('Escribe BORRAR para confirmar')!=='BORRAR') return toast('Cancelado');
  db([{table:'movements',action:'delete',match:{household_id:S.hh.id}},{table:'goals',action:'delete',match:{household_id:S.hh.id}}]); toast('🧹 Listo, empezamos de cero');
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
