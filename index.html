<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#111827;--mu:#6b7280;--ln:#e8e9f3;--pr:#4f46e5;--prl:#eef2ff;--ok:#10b981;--okl:#d1fae5;--wa:#f59e0b;--wal:#fef3c7;--rd:#ef4444;--rdl:#fee2e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 104px)}
h1{font-size:25px;margin:4px 0 12px;letter-spacing:-.02em}
h2{font-size:13px;margin:0 0 10px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(17,24,39,.05),0 6px 20px rgba(79,70,229,.04)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row+.row{margin-top:10px}
.mu{color:var(--mu);font-size:13px}.b{font-weight:700}.sm{font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--rd)}.warn{color:#b45309}
.hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#0ea5e9 100%);color:#fff;border-radius:24px;padding:20px;margin-bottom:12px;box-shadow:0 10px 30px rgba(79,70,229,.3)}
.hero .mu{color:rgba(255,255,255,.8)}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:4px 0}
.hero .pill{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;flex:1}
.hero .pill b{display:block;font-size:15px}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--pr);transition:width .4s}
.ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}
.item:first-of-type{border-top:0;padding-top:2px}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px}
.st.green{background:var(--okl);color:#047857}.st.yellow{background:var(--wal);color:#92400e}.st.red{background:var(--rdl);color:#b91c1c}.st.done{background:var(--prl);color:var(--pr)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--ln);color:#374151;vertical-align:middle}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
input,select,textarea{font:inherit;width:100%;padding:12px 13px;border:1.5px solid var(--ln);border-radius:13px;background:#fff;color:var(--tx);outline:none}
input:focus,select:focus{border-color:var(--pr)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px;font-weight:600}
button{font:inherit;border:0;border-radius:13px;padding:12px 15px;background:var(--pr);color:#fff;font-weight:650;cursor:pointer}
button.sec{background:var(--prl);color:var(--pr)}
button.gh{background:transparent;color:var(--pr);padding:8px}
button.dg{background:var(--rdl);color:#b91c1c}
button.ok{background:var(--ok)}
button.mini{padding:7px 11px;font-size:14px;border-radius:11px;white-space:nowrap}
button:disabled{opacity:.4}
.full{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:20px;background:#fff;color:var(--tx);font-size:14px;font-weight:600;border:1.5px solid var(--ln)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick button{background:#fff;color:var(--tx);border:1.5px solid var(--ln);padding:10px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.pick button span{font-size:24px}
.pick button.on{border-color:var(--pr);background:var(--prl);color:var(--pr)}
.amt{font-size:34px;font-weight:800;text-align:center;border:0;background:var(--prl);color:var(--pr)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{background:none;color:var(--mu);font-size:11px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;flex:1}
nav button span{font-size:21px}
nav button.on{color:var(--pr)}
nav .fab{flex:none;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:30px;margin:-26px 6px 2px;box-shadow:0 8px 20px rgba(79,70,229,.45);padding:0;justify-content:center}
#sheet{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .box{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto;animation:up .22s ease}
#sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--ln);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:#111827;color:#fff;padding:11px 17px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
.alert{display:flex;gap:10px;align-items:center;background:var(--rdl);color:#991b1b;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px;font-weight:600}
.alert.y{background:var(--wal);color:#92400e}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.2em;font-weight:800;color:var(--pr)}
.hbar{display:flex;align-items:center;gap:10px;margin-top:10px}
.hbar .lb{width:112px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:12px;background:var(--ln);border-radius:8px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:8px}
.hbar .vl{width:74px;text-align:right;font-weight:700;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:18px 8px}
.empty span{font-size:40px;display:block;margin-bottom:6px}
.sect{font-size:13px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px}
</style>
</head>
<body>
<div id="app"><p class="mu" style="text-align:center;margin-top:40vh">Cargando…</p></div>
<nav id="nav" hidden>
  <button data-t="inicio" onclick="go('inicio')"><span>🏠</span>Inicio</button>
  <button data-t="quincena" onclick="go('quincena')"><span>📅</span>Quincena</button>
  <button class="fab" onclick="sheetGasto()">＋</button>
  <button data-t="apartados" onclick="go('apartados')"><span>🎯</span>Apartados</button>
  <button data-t="analisis" onclick="go('analisis')"><span>📊</span>Análisis</button>
</nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="box"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast"></div>

<script>
// ============ CONFIGURACIÓN ============
const SUPABASE_URL = 'https://savkihtjsvzmahcgvygr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_u9vum-h6roZid1UFmpW7Yw_EbZ-srT9';
// =======================================

const sb = SUPABASE_URL.startsWith('http') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const S = {user:null, hh:null, me:'', members:[], accounts:[], incomes:[], goals:[], movs:[], who:'Todos', bank:'Todos', tab:'inicio', q:null, period:'q', sim:{}};
const KINDS = {fijo:'Gasto fijo', pago:'Deuda / pago', meta:'Meta de ahorro'};
const CAT_IC = {Gasolina:'⛽',Comida:'🍔',Salidas:'🎉','Súper':'🛒',Casa:'🏠',Salud:'💊',Ropa:'👕',Otro:'📦',Transporte:'🚕',Café:'☕',Regalos:'🎁',Mascotas:'🐶',Escuela:'📚',Antojos:'🍦',Uber:'🚗'};
const EMOJIS = ['🏠','🌐','📱','💧','💡','🔥','📺','🎓','🎄','🏥','🐷','🤝','🔧','🎨','🚗','✈️','💍','👶','🐶','🎁','💳','👴','📚','🏋️','🎮','🛋️','💻','🧾','🎯','💰'];
const COLORS = ['#dc2626','#2563eb','#16a34a','#d97706','#7c3aed','#db2777','#0891b2','#475569'];
const KCOL = {fijo:['#eef2ff','#4f46e5'], pago:['#fff1f2','#e11d48'], meta:['#ecfdf5','#059669']};

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const sum = a => a.reduce((x,y)=>x+(+y||0),0);
const money = n => (n<-0.5?'-':'')+'$'+Math.abs(Math.round(+n||0)).toLocaleString('es-MX');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const iso = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const qEnd = (y,m) => Math.min(30, new Date(y,m,0).getDate());
function todayISO(){ const t=new Date(); return iso(t.getFullYear(),t.getMonth()+1,t.getDate()); }
function fmtD(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+dd} ${MES[m-1]}${+y!==new Date().getFullYear()?' '+y.slice(2):''}`; }
function qOf(d){ const [y,m,day]=d.split('-').map(Number);
  if(day>=qEnd(y,m)) return iso(y,m,qEnd(y,m)); if(day>=15) return iso(y,m,15);
  const pm=m===1?12:m-1, py=m===1?y-1:y; return iso(py,pm,qEnd(py,pm)); }
const currentQ = () => qOf(todayISO());
function shiftQ(q,dir){ let [y,m,d]=q.split('-').map(Number);
  if(dir>0){ if(d===15) return iso(y,m,qEnd(y,m)); m++; if(m>12){m=1;y++;} return iso(y,m,15); }
  if(d!==15) return iso(y,m,15); m--; if(m<1){m=12;y--;} return iso(y,m,qEnd(y,m)); }
function countQ(from,due){ let c=0,x=from; while(x<=due&&c<300){c++;x=shiftQ(x,1);} return c; }
const dayMs = 864e5, toDate = d => new Date(d+'T12:00:00');
const daysBetween = (a,b) => Math.round((toDate(b)-toDate(a))/dayMs);
function addMonths(d,n){ const [y,m,dd]=d.split('-').map(Number); const t=new Date(y,m-1+n,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return iso(t.getFullYear(),t.getMonth()+1,Math.min(dd,last)); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800); }
function fail(e){ console.error(e); toast('⚠️ '+(e?.message||String(e))); }
const num = v => parseFloat(String(v).replace(/[^0-9.\-]/g,''))||0;
function openSheet(html){ $('#sheetBody').innerHTML=html; $('#sheet').classList.add('show'); }
function closeSheet(){ $('#sheet').classList.remove('show'); }

// ---------- personas / bancos ----------
const first = n => (n||'').trim().split(' ')[0];
const people = () => [...S.members.map(m=>first(m.display_name)).filter(Boolean),'Compartido'];
const nameOfUser = uid => first((S.members.find(m=>m.user_id===uid)||{}).display_name)||'Compartido';
const defOwner = () => S.who!=='Todos'?S.who:(first(S.me)||'Compartido');
const mine = o => S.who==='Todos' || (o.owner||'Compartido')===S.who;
const goalById = id => S.goals.find(g=>g.id===id);
const movMine = m => { if(S.who==='Todos') return true; if(m.goal_id){ const g=goalById(m.goal_id); return g?mine(g):false; } return nameOfUser(m.created_by)===S.who; };
const acc = n => S.accounts.find(a=>a.name===n);
const accColor = n => (acc(n)||{}).color||'#64748b';
const bankTag = n => `<span class="tag"><i class="dot" style="background:${accColor(n)}"></i>${esc(n)}</span>`;
const accSaved = (n,all) => sum(S.movs.filter(m=>m.goal_id&&m.account===n&&(all||movMine(m))).map(m=>m.amount));
const overflowAcc = () => (S.accounts.find(a=>!+a.tope)||{name:'Banorte'}).name;
const catIc = c => CAT_IC[c]||'💸';

// ---------- cálculos ----------
const incomesQ = q => S.incomes.filter(i=>mine(i)&&(!i.start_date||i.start_date<=q)&&(!i.end_date||i.end_date>=q));
const incomeQ = q => sum(incomesQ(q).map(i=>i.amount));
const inQ = (m,q) => qOf(m.date)===q;
function freeQ(q){ // lo que queda para gastar de una quincena
  let f = incomeQ(q);
  for(const m of S.movs){ if(!movMine(m)||!inQ(m,q)) continue;
    if(m.goal_id && (m.kind==='aparta'||m.kind==='retira')) f -= +m.amount;
    else if(!m.goal_id && m.kind!=='inicial') f += +m.amount;   // gastos (−) y ajustes (±)
  }
  return f;
}
const libreInicial = () => sum(S.movs.filter(m=>!m.goal_id&&m.kind==='inicial'&&movMine(m)).map(m=>m.amount));
const startQ = () => S.hh.start_q || qOf((S.hh.created_at||todayISO()).slice(0,10));
function libreHasta(q){ let t=libreInicial(), x=startQ(), c=0; while(x<=q&&c<500){ t+=freeQ(x); x=shiftQ(x,1); c++; } return t; }
function daysLeft(){ return Math.max(1, daysBetween(todayISO(), shiftQ(currentQ(),1))); }
const apartadoQ = q => sum(S.movs.filter(m=>m.goal_id&&m.kind==='aparta'&&inQ(m,q)&&movMine(m)).map(m=>m.amount));
const gastadoQ = q => -sum(S.movs.filter(m=>m.kind==='gasto'&&inQ(m,q)&&movMine(m)).map(m=>m.amount));

function gst(g, over){ // estado de un apartado; over = cambios para el simulador
  const o=over||{}, q=currentQ(), today=todayISO();
  const ms=S.movs.filter(m=>m.goal_id===g.id);
  const saldo=sum(ms.map(m=>m.amount))+(o.extra||0);
  const pagado=-sum(ms.filter(m=>m.kind==='pago').map(m=>m.amount));
  const pagosQ=ms.filter(m=>m.kind==='pago'&&inQ(m,q)).sort((a,b)=>a.created_at<b.created_at?1:-1);
  const lastPago=pagosQ[0];
  const aportQ=sum(ms.filter(m=>m.kind==='aparta'&&inQ(m,q)&&(!lastPago||m.created_at>lastPago.created_at)).map(m=>m.amount))+(o.extra||0);
  const target=+g.target||0, due=o.due!==undefined?o.due:g.due_date;
  let avance, falta, n=0, cuota=0, pend=0, pct=0, st='', stc='';
  if(g.kind==='fijo'){
    avance=saldo; falta=Math.max(0,target-saldo);
    n = due ? countQ(q,due) : 2*(g.freq_months||1);
    const base=Math.max(0,target-(saldo-aportQ)); cuota=n>0?base/n:base; pend=Math.max(0,Math.min(falta,cuota-aportQ));
    pct=target?Math.min(100,saldo/target*100):0;
    const dl=due?daysBetween(today,due):null;
    if(target&&saldo>=target-0.5){st='Listo para pagar';stc='done';}
    else if(dl!==null&&dl<0){st='Vencido';stc='red';}
    else if(pend<=0.5){st='Al corriente';stc='green';}
    else if(dl!==null&&dl<=5){st=`Faltan ${money(falta)} · vence en ${dl} d`;stc='red';}
    else {st=`Toca ${money(pend)}`;stc='yellow';}
  } else {
    avance=g.kind==='pago'?saldo+pagado:saldo; falta=Math.max(0,target-avance);
    if(target&&due){ n=countQ(q,due); const base=Math.max(0,falta+aportQ); cuota=n>0?base/n:base; pend=Math.max(0,cuota-aportQ); }
    else if(+g.cuota){ cuota=+g.cuota; pend=Math.max(0,cuota-aportQ); if(target) pend=Math.min(pend,falta); }
    pct=target?Math.min(100,avance/target*100):0;
    if(target&&falta<=0.5){st='Cumplida 🎉';stc='done';}
    else if(due&&due<today){st='Vencida';stc='red';}
    else if(!cuota){st=target?`Faltan ${money(falta)}`:'Sin meta';stc='green';}
    else if(pend<=0.5){st='Al corriente';stc='green';}
    else {st=`Toca ${money(pend)}`;stc='yellow';}
  }
  return {saldo,pagado,aportQ,avance,falta,n,cuota,pend,pct,st,stc,due};
}
const activeGoals = () => S.goals.filter(g=>!g.archived&&mine(g));
const totalPend = () => sum(activeGoals().map(g=>gst(g).pend));
const totalCuota = () => sum(activeGoals().map(g=>gst(g).cuota));

// ---------- arranque ----------
async function boot(){
  if(!sb) return;
  const {data:{session}} = await sb.auth.getSession();
  S.user=session?.user||null;
  if(!S.user) return vLogin();
  const {data:mem,error}=await sb.from('members').select('household_id,display_name').eq('user_id',S.user.id).limit(1);
  if(error) return fail(error);
  if(!mem.length) return vHousehold();
  S.hh={id:mem[0].household_id}; S.me=mem[0].display_name||'';
  try{ await loadAll(); }catch(e){ return fail(e); }
  S.q=S.q||currentQ(); render();
}
async function loadAll(){
  const h=S.hh.id;
  const r=await Promise.all([
    sb.from('households').select('*').eq('id',h).single(),
    sb.from('incomes').select('*').eq('household_id',h).order('created_at'),
    sb.from('goals').select('*').eq('household_id',h).order('sort').order('created_at'),
    sb.from('movements').select('*').eq('household_id',h).order('date',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('members').select('user_id,display_name').eq('household_id',h),
    sb.from('accounts').select('*').eq('household_id',h).order('sort').order('created_at')
  ]);
  for(const x of r) if(x.error) throw x.error;
  [S.hh,S.incomes,S.goals,S.movs,S.members,S.accounts]=r.map(x=>x.data);
}
async function refresh(){ try{ await loadAll(); render(); }catch(e){ fail(e); } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.hh) refresh(); });
function render(){
  $('#nav').hidden=false;
  document.querySelectorAll('#nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  $('#app').innerHTML=({inicio:vInicio,quincena:vQuincena,apartados:vApartados,analisis:vAnalisis,config:vConfig}[S.tab])();
}
function go(t){ S.tab=t; if(t==='quincena') S.q=currentQ(); render(); scrollTo(0,0); }
function whoBar(){ return `<div class="chips">${['Todos',...people()].map(p=>`<button class="chip ${S.who===p?'on':''}" onclick="S.who='${esc(p)}';render()">${p==='Todos'?'👥 Todos':p==='Compartido'?'🤝 Compartido':'👤 '+esc(p)}</button>`).join('')}</div>`; }

// ---------- login / hogar ----------
function vLogin(){
  $('#nav').hidden=true;
  $('#app').innerHTML=`<div style="text-align:center;margin:8vh 0 20px"><div style="font-size:56px">💰</div><h1>Finanzas</h1><p class="mu">Organiza tu quincena en pareja</p></div>
  <div class="card"><label>Correo</label><input id="em" type="email" autocomplete="email">
  <label>Contraseña</label><input id="pw" type="password" autocomplete="current-password">
  <div class="grid2" style="margin-top:16px"><button onclick="doLogin(false)">Entrar</button><button class="sec" onclick="doLogin(true)">Crear cuenta</button></div></div>`;
}
async function doLogin(signup){
  const email=$('#em').value.trim(), password=$('#pw').value;
  if(!email||password.length<6) return toast('Correo y contraseña (mín. 6)');
  const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error) return fail(r.error);
  if(signup&&!r.data.session) return toast('Cuenta creada. Pide que la confirmen y luego entra.');
  boot();
}

function goalRow(g, opts={}){

  const barCol = s.stc==='red'?'var(--rd)':s.stc==='yellow'?'var(--wa)':s.stc==='done'?'var(--pr)':'var(--ok)';
  const right = g.kind==='fijo' ? `${money(s.saldo)}<span class="mu"> / ${money(g.target)}</span>` : `${money(s.avance)}${+g.target?`<span class="mu"> / ${money(g.target)}</span>`:''}`;
  const sub = g.kind==='fijo' ? (s.due?`Paga ${fmtD(s.due)}`:'Sin fecha de pago') : (s.due?`Meta ${fmtD(s.due)}`:(+g.cuota?`${money(g.cuota)} por quincena`:''));
  return `<div class="item" ${opts.click?`onclick="sheetGoal('${g.id}')" style="cursor:pointer"`:''}>
    <div class="ic" style="background:${bg};color:${fg}">${esc(g.icon||'🎯')}</div>
    <div class="grow"><div class="row"><span class="nm">${esc(g.name)}</span><span class="b" style="white-space:nowrap">${right}</span></div>

      <div class="row" style="margin-top:6px"><span class="st ${s.stc}">${s.st}</span><span class="mu">${sub}</span></div>
      ${opts.actions?goalActions(g):''}</div></div>`;
}

async function apartar(g, amount, kind='aparta', note=null, date=null){
  const base={household_id:S.hh.id,goal_id:g.id,kind,date:date||todayISO(),note};
  const a=acc(g.account), rows=[];
  if(kind==='aparta' && a && +a.tope){
    const room=Math.max(0,+a.tope-accSaved(a.name,true)), inA=Math.min(room,amount), rest=amount-inA, ov=overflowAcc();
    if(inA>0) rows.push({...base,account:a.name,amount:inA});
    if(rest>0){ rows.push({...base,account:ov,amount:rest,note:(note?note+' · ':'')+`excedente del tope de ${a.name}`}); toast(`${a.name} está lleno: ${money(rest)} van a ${ov}`); }
  } else rows.push({...base,account:g.account,amount: kind==='aparta'||kind==='inicial'?amount:-amount});
  const {error}=await sb.from('movements').insert(rows); if(error){ fail(error); return false; } return true;
}
async function apartarDe(id){ const g=goalById(id), v=num($('#ap_'+id).value); if(v<=0) return toast('Escribe un monto');
  if(await apartar(g,v)){ toast(`✅ ${money(v)} a ${g.name}`); refresh(); } }
async function apartarTodo(){
  const list=activeGoals().map(g=>[g,gst(g).pend]).filter(([g,p])=>p>0.5);
  if(!confirm(`¿Apartar ${money(sum(list.map(x=>x[1])))} en ${list.length} apartados?`)) return;
  for(const [g,p] of list){ if(!await apartar(g,Math.round(p))) return; }
  toast('⚡ Listo, todo apartado'); refresh();
}

  <div id="e_cuw" style="${g.kind==='fijo'?'display:none':''}"><label>Cuota fija (si no hay fecha)</label><input id="e_cuota" type="number" inputmode="decimal" value="${g.cuota??''}"></div>
  <div><label>Banco</label><select id="e_acc">${S.accounts.map(a=>`<option ${g.account===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div></div>
  <label>De quién</label><select id="e_owner">${people().map(p=>`<option ${g.owner===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
  <button class="full" style="margin-top:16px" onclick="saveGoal('${id}')">Guardar</button>
  ${id!=='new'?`<div class="grid2" style="margin-top:10px"><button class="sec" onclick="archive('${id}')">🗄 Archivar</button><button class="dg" onclick="delGoal('${id}')">🗑 Borrar</button></div>${historyOf(g)}`:''}`);
}
function setKind(k){ $('#e_k').value=k; document.querySelectorAll('#e_kind button').forEach(b=>b.classList.toggle('sec',b.dataset.k!==k));
  $('#e_tl').textContent=k==='fijo'?'Monto mensual':'Meta total'; $('#e_dl').textContent=k==='fijo'?'Próximo pago':'Fecha meta';
  $('#e_freqw').style.display=k==='fijo'?'':'none'; $('#e_cuw').style.display=k==='fijo'?'none':''; }
async function saveGoal(id){
  const row={household_id:S.hh.id,kind:$('#e_k').value,icon:window._ic,name:$('#e_name').value.trim(),target:num($('#e_target').value)||null,
    due_date:$('#e_due').value||null,freq_months:+$('#e_freq').value||1,cuota:num($('#e_cuota').value)||null,account:$('#e_acc').value,owner:$('#e_owner').value};
  if(!row.name) return toast('Ponle nombre');
  if(row.kind==='fijo'&&!row.target) return toast('Pon el monto mensual');
  const r=id==='new'?await sb.from('goals').insert(row):await sb.from('goals').update(row).eq('id',id);
  if(r.error) return fail(r.error); closeSheet(); toast('✅ Guardado'); refresh();
}
async function archive(id){ const {error}=await sb.from('goals').update({archived:true}).eq('id',id); if(error) return fail(error); closeSheet(); refresh(); }
async function unarchive(id){ const {error}=await sb.from('goals').update({archived:false}).eq('id',id); if(error) return fail(error); refresh(); }
async function delGoal(id){ const g=goalById(id); if(!confirm(`¿Borrar "${g.name}" y todo su historial?`)) return;
  const a=await sb.from('movements').delete().eq('goal_id',id); if(a.error) return fail(a.error);
  const b=await sb.from('goals').delete().eq('id',id); if(b.error) return fail(b.error); closeSheet(); toast('Borrado'); refresh(); }

// ---------- ANÁLISIS ----------
function periodRange(p){
  const t=todayISO(), [y,m]=t.split('-').map(Number);
  if(p==='q'){ const q=currentQ(); return [q, t, shiftQ(q,-1), shiftQ(q,1)>q?null:null, 'esta quincena']; }
  if(p==='m') return [iso(y,m,1), t, null, null, 'este mes'];
  const pm=m===1?12:m-1, py=m===1?y-1:y; return [iso(py,pm,1), iso(py,pm,new Date(py,pm,0).getDate()), null, null, 'el mes pasado'];
}
function gastosEntre(a,b){ return S.movs.filter(m=>m.kind==='gasto'&&movMine(m)&&m.date>=a&&m.date<=b); }
function hbars(rows,max,color){ return rows.map(([lb,v,ic,col])=>`<div class="hbar"><span class="lb">${ic||''} ${esc(lb)}</span><span class="tr"><i style="width:${max?Math.max(2,v/max*100):0}%;background:${col||color}"></i></span><span class="vl">${money(v)}</span></div>`).join(''); }
function vAnalisis(){
  const [a,b,,,lbl]=periodRange(S.period), gs=gastosEntre(a,b), tot=-sum(gs.map(m=>m.amount));
  // periodo anterior equivalente
  let pa,pb; if(S.period==='q'){ const q=currentQ(); pa=shiftQ(q,-1); pb=iso(...q.split('-').map(Number)); const d=new Date(toDate(q)-dayMs); pb=iso(d.getFullYear(),d.getMonth()+1,d.getDate()); }
  else { const d=toDate(a); const p=new Date(d.getFullYear(),d.getMonth()-1,1); pa=iso(p.getFullYear(),p.getMonth()+1,1); pb=iso(p.getFullYear(),p.getMonth()+1,new Date(p.getFullYear(),p.getMonth()+1,0).getDate()); }
  const prev=-sum(gastosEntre(pa,pb).map(m=>m.amount)), diff=prev?((tot-prev)/prev*100):null;
  const byCat={}, byAcc={}; for(const m of gs){ byCat[m.category||'Otro']=(byCat[m.category||'Otro']||0)-m.amount; byAcc[m.account]=(byAcc[m.account]||0)-m.amount; }
  const cats=Object.entries(byCat).sort((x,y)=>y[1]-x[1]), accs=Object.entries(byAcc).sort((x,y)=>y[1]-x[1]);
  const palette=['#4f46e5','#7c3aed','#0ea5e9','#10b981','#f59e0b','#ef4444','#db2777','#64748b'];
  // proyección próximas quincenas
  const proj=[]; let q=currentQ(); const gsA=activeGoals();
  for(let i=0;i<8;i++){ const entra=incomeQ(q);
    const comp=sum(gsA.map(g=>{ const s=gst(g); if(g.kind==='fijo') return i===0?s.cuota:(+g.target||0)/(2*(g.freq_months||1));
      if(s.due) return q<=s.due&&s.falta>0.5?s.cuota:0; return +g.cuota&&(!+g.target||s.falta>0.5)?+g.cuota:0; }));
    proj.push([q,entra,comp,entra-comp]); q=shiftQ(q,1); }
  const pmax=Math.max(...proj.map(p=>p[1]),1);
  const sg=goalById(S.sim.id)||activeGoals().find(g=>g.kind!=='fijo')||activeGoals()[0];
  return `<h1>Análisis 📊</h1>${whoBar()}
  <div class="chips">${[['q','Esta quincena'],['m','Este mes'],['pm','Mes pasado']].map(([k,t])=>`<button class="chip ${S.period===k?'on':''}" onclick="S.period='${k}';render()">${t}</button>`).join('')}</div>
  <div class="card"><h2>💸 Gastaste ${lbl}</h2><div style="font-size:34px;font-weight:800">${money(tot)}</div>
    ${diff!==null?`<div class="mu">${diff>0?'🔺':'🔻'} ${Math.abs(Math.round(diff))}% vs periodo anterior (${money(prev)})</div>`:'<div class="mu">Sin datos del periodo anterior</div>'}
    ${cats.length?hbars(cats.map(([c,v],i)=>[c,v,catIc(c),palette[i%palette.length]]),cats[0][1]):'<div class="empty"><span>🧾</span>No hay gastos en este periodo</div>'}</div>
  ${accs.length?`<div class="card"><h2>💳 Cómo pagaste</h2>${hbars(accs.map(([n,v])=>[n,v,'',accColor(n)]),accs[0][1])}</div>`:''}
  <div class="card"><h2>🔮 Próximas quincenas</h2><div class="mu" style="margin-bottom:6px">Lo que entra, lo que ya está comprometido en apartados y lo que te quedaría libre</div>
    ${proj.map(([q,e,c,l])=>`<div style="margin-top:12px"><div class="row sm"><b>${fmtD(q)}</b><span>Libre <b class="${l<0?'neg':l<1500?'warn':'pos'}">${money(l)}</b></span></div>
      <div class="bar" style="height:12px;display:flex"><i style="width:${Math.min(100,c/pmax*100)}%;background:#7c3aed;border-radius:8px 0 0 8px"></i><i style="width:${Math.max(0,Math.min(100,l/pmax*100))}%;background:#10b981;border-radius:0 8px 8px 0"></i></div>
      <div class="mu sm">Entra ${money(e)} · apartados ${money(c)}</div></div>`).join('')}
    <div class="row mu sm" style="margin-top:12px;justify-content:flex-start;gap:14px"><span><i class="dot" style="background:#7c3aed"></i> Apartados</span><span><i class="dot" style="background:#10b981"></i> Libre</span></div></div>
  ${sg?vSim(sg):''}
  <div class="card"><h2>🧾 Gastos ${lbl}</h2>${gs.length?gs.map(gastoRow).join(''):'<p class="mu">Sin gastos</p>'}</div>`;
}
function vSim(g){
  const s=gst(g), o={due:S.sim.due||g.due_date, extra:+S.sim.extra||0}, n=gst(g,o), dl=daysLeft(), libre=libreHasta(currentQ());
  const libre2=libre-o.extra-(n.pend-s.pend);
  return `<div class="card"><h2>🧪 Simulador · ¿qué pasa si…?</h2>
    <label>Apartado</label><select onchange="S.sim={id:this.value};render()">${activeGoals().map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.icon||'')} ${esc(x.name)}</option>`).join('')}</select>
    <div class="grid2"><div><label>Meter extra hoy</label><input type="number" inputmode="decimal" value="${S.sim.extra||''}" placeholder="$0" onchange="S.sim.id='${g.id}';S.sim.extra=num(this.value);render()"></div>
    <div><label>${g.kind==='fijo'?'Próximo pago':'Nueva fecha'}</label><input type="date" value="${o.due||''}" onchange="S.sim.id='${g.id}';S.sim.due=this.value;render()"></div></div>
    <div class="grid2" style="margin-top:14px;text-align:center">
      <div style="background:var(--bg);border-radius:14px;padding:10px"><div class="mu">Hoy</div><div class="b">${money(s.cuota)}/quincena</div><div class="mu sm">${money(libre/dl)} por día</div></div>
      <div style="background:var(--prl);border-radius:14px;padding:10px"><div class="mu">Con el cambio</div><div class="b" style="color:var(--pr)">${money(n.cuota)}/quincena</div><div class="mu sm">${money(libre2/dl)} por día</div></div></div>
    <p class="mu sm" style="margin-bottom:0">${n.falta<=0.5?'🎉 Con eso la cumples.':n.cuota<s.cuota?`Te libera ${money(s.cuota-n.cuota)} cada quincena.`:n.cuota>s.cuota?`Necesitarías ${money(n.cuota-s.cuota)} más cada quincena.`:'Sin cambio en la cuota.'}</p>
    ${S.sim.extra||S.sim.due?`<button class="gh mini" onclick="S.sim={id:'${g.id}'};render()">Limpiar</button>`:''}</div>`;
}

// ---------- CONFIGURACIÓN ----------
function vConfig(){
  const cats=S.hh.categories||[];
  return `<div class="row"><h1>⚙️ Configuración</h1><button class="sec mini" onclick="go('inicio')">‹ Volver</button></div>
  <div class="card"><div class="row"><h2 style="margin:0">🏦 Bancos</h2><button class="mini" onclick="sheetAcc('new')">＋ Agregar</button></div>
    ${S.accounts.map(a=>`<div class="item" onclick="sheetAcc('${a.id}')" style="cursor:pointer"><div class="ic" style="background:${a.color}22;color:${a.color}">🏦</div><div class="grow"><div class="row"><span class="nm">${esc(a.name)}</span><b>${money(accSaved(a.name,true))}</b></div>
      <div class="mu">${+a.tope?'Tope '+money(a.tope):'Sin tope'}${+a.rate?' · '+(+a.rate)+'% anual':''}</div></div></div>`).join('')}</div>
  <div class="card"><div class="row"><h2 style="margin:0">💵 Ingresos por quincena</h2><button class="mini" onclick="sheetInc('new')">＋ Agregar</button></div>
    ${S.incomes.map(i=>`<div class="item" onclick="sheetInc('${i.id}')" style="cursor:pointer"><div class="ic" style="background:var(--okl)">💵</div><div class="grow"><div class="row"><span class="nm">${esc(i.name)}</span><b>${money(i.amount)}</b></div>
      <div class="mu">${esc(i.owner||'Compartido')}${i.start_date?' · desde '+fmtD(i.start_date):''}${i.end_date?' · hasta '+fmtD(i.end_date):''}</div></div></div>`).join('')||'<p class="mu">Sin ingresos</p>'}</div>
  <div class="card"><h2>🏷 Categorías de gasto</h2><div class="chips" style="flex-wrap:wrap">${cats.map(c=>`<button class="chip" onclick="delCat('${esc(c)}')">${catIc(c)} ${esc(c)} ✕</button>`).join('')}</div>
    <div class="row"><input id="newcat" placeholder="Nueva categoría (ej. Café)"><button class="mini" onclick="addCat()">Agregar</button></div></div>
  <div class="card"><h2>👥 Personas</h2>${S.members.map(m=>`<div class="row"><input id="mn_${m.user_id}" value="${esc(m.display_name||'')}"><button class="mini sec" onclick="renameMember('${m.user_id}')">Guardar</button></div>`).join('')}
    <div class="row" style="margin-top:14px"><span>Código para invitar</span><span class="code">${esc(S.hh.invite_code)}</span></div></div>
  <div class="card"><h2>💸 Dinero para gastar</h2><p class="mu" style="margin-top:0">Si tu dinero libre real no cuadra con la app, ajústalo aquí.</p>
    <div class="row"><input id="adj" type="number" inputmode="decimal" placeholder="Monto (+ o −)"><button class="mini" onclick="ajusteLibre()">Ajustar</button></div></div>
  <button class="dg full" onclick="logout()">Cerrar sesión</button>`;
}
function sheetAcc(id){
  const a=id==='new'?{color:COLORS[S.accounts.length%COLORS.length]}:S.accounts.find(x=>x.id===id); window._col=a.color;
  openSheet(`<h1>${id==='new'?'Nuevo banco':'Editar banco'}</h1>
  <label>Nombre</label><input id="a_name" value="${esc(a.name)}" placeholder="Ej. Nu">
  <div class="grid2"><div><label>Tope (opcional)</label><input id="a_tope" type="number" inputmode="decimal" value="${a.tope??''}"></div><div><label>Rendimiento % anual</label><input id="a_rate" type="number" inputmode="decimal" value="${a.rate??''}"></div></div>
  <label>Color</label><div class="chips" id="a_cols">${COLORS.map(c=>`<button class="chip ${c===a.color?'on':''}" style="background:${c};border-color:${c};width:38px;height:38px;padding:0" onclick="window._col='${c}';pickOn('a_cols',this)"></button>`).join('')}</div>
  <button class="full" style="margin-top:14px" onclick="saveAcc('${id}')">Guardar</button>
  ${id!=='new'?`<button class="dg full" style="margin-top:10px" onclick="delAcc('${id}')">🗑 Eliminar banco</button>`:''}`);
}
async function saveAcc(id){
  const row={household_id:S.hh.id,name:$('#a_name').value.trim(),tope:num($('#a_tope').value)||null,rate:num($('#a_rate').value)||null,color:window._col};
  if(!row.name) return toast('Ponle nombre');
  if(id==='new'){ row.sort=S.accounts.length; const {error}=await sb.from('accounts').insert(row); if(error) return fail(error); }
  else { const old=S.accounts.find(x=>x.id===id).name; const {error}=await sb.from('accounts').update(row).eq('id',id); if(error) return fail(error);
    if(old!==row.name){ await sb.from('goals').update({account:row.name}).eq('household_id',S.hh.id).eq('account',old); await sb.from('movements').update({account:row.name}).eq('household_id',S.hh.id).eq('account',old); } }
  closeSheet(); toast('✅ Banco guardado'); refresh();
}
async function delAcc(id){ const a=S.accounts.find(x=>x.id===id); const used=S.goals.filter(g=>g.account===a.name).length;
  if(used) return toast(`Primero cambia de banco ${used} apartado(s) que usan ${a.name}`);
  if(!confirm(`¿Eliminar ${a.name}?`)) return; const {error}=await sb.from('accounts').delete().eq('id',id); if(error) return fail(error); closeSheet(); refresh(); }
function sheetInc(id){
  const i=id==='new'?{owner:defOwner()}:S.incomes.find(x=>x.id===id);
  openSheet(`<h1>${id==='new'?'Nuevo ingreso':'Editar ingreso'}</h1>
  <label>Concepto</label><input id="i_name" value="${esc(i.name)}" placeholder="Ej. Nómina">
  <div class="grid2"><div><label>Monto por quincena</label><input id="i_amt" type="number" inputmode="decimal" value="${i.amount??''}"></div><div><label>De quién</label><select id="i_owner">${people().map(p=>`<option ${i.owner===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div></div>
  <div class="grid2"><div><label>Desde (opcional)</label><input id="i_start" type="date" value="${i.start_date??''}"></div><div><label>Hasta (opcional)</label><input id="i_end" type="date" value="${i.end_date??''}"></div></div>
  <p class="mu sm">Para un ingreso de una sola vez (bono, aguinaldo), pon la misma quincena en Desde y Hasta.</p>
  <button class="full" onclick="saveInc('${id}')">Guardar</button>
  ${id!=='new'?`<button class="dg full" style="margin-top:10px" onclick="delInc('${id}')">🗑 Eliminar</button>`:''}`);
}
async function saveInc(id){
  const row={household_id:S.hh.id,name:$('#i_name').value.trim(),amount:num($('#i_amt').value),owner:$('#i_owner').value,start_date:$('#i_start').value||null,end_date:$('#i_end').value||null};
  if(!row.name||!row.amount) return toast('Concepto y monto');
  const r=id==='new'?await sb.from('incomes').insert(row):await sb.from('incomes').update(row).eq('id',id); if(r.error) return fail(r.error); closeSheet(); toast('✅ Guardado'); refresh();
}
async function delInc(id){ if(!confirm('¿Eliminar ingreso?')) return; const {error}=await sb.from('incomes').delete().eq('id',id); if(error) return fail(error); closeSheet(); refresh(); }
async function saveCats(c){ const {error}=await sb.from('households').update({categories:c}).eq('id',S.hh.id); if(error) return fail(error); refresh(); }
function addCat(){ const v=$('#newcat').value.trim(); if(!v) return; const c=S.hh.categories||[]; if(c.includes(v)) return toast('Ya existe'); saveCats([...c,v]); }
function delCat(c){ if(confirm(`¿Quitar la categoría ${c}?`)) saveCats((S.hh.categories||[]).filter(x=>x!==c)); }
async function renameMember(uid){ const v=$('#mn_'+uid).value.trim(); if(!v) return; const {error}=await sb.from('members').update({display_name:v}).eq('household_id',S.hh.id).eq('user_id',uid); if(error) return fail(error); toast('✅ Nombre guardado'); refresh(); }
async function ajusteLibre(){ const v=num($('#adj').value); if(!v) return toast('Escribe un monto');
  const {error}=await sb.from('movements').insert({household_id:S.hh.id,goal_id:null,kind:'ajuste',account:'Efectivo',amount:v,date:todayISO(),note:'Ajuste de dinero libre'}); if(error) return fail(error); toast('✅ Ajustado'); refresh(); }

boot();
</script>
